<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vishwas Rate Admin - Live</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef2f5;color:#101828}.syncbar{position:sticky;top:0;z-index:999;background:#101827;color:#fff;padding:10px 14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;box-shadow:0 5px 20px #0003}.title{font-weight:950;margin-right:6px}.syncbar input{min-width:260px;flex:1;max-width:440px;border:1px solid #64748b;border-radius:8px;padding:9px}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:950;cursor:pointer}.green{background:#087f70;color:#fff}.light{background:#fff;color:#101827}.status{font-size:12px;font-weight:900;color:#b7f7e5}.hint{width:100%;font-size:10px;color:#cbd5e1}.frame{width:100%;height:calc(100vh - 92px);border:0;display:block;background:#fff}@media(max-width:700px){.syncbar input{min-width:100%;max-width:none}.frame{height:calc(100vh - 150px)}}
</style>
</head>
<body>
<div class="syncbar">
  <span class="title">VRCL LIVE ADMIN</span>
  <input id="token" type="password" autocomplete="off" placeholder="GitHub fine-grained token (Contents: Read & Write)">
  <button class="btn light" id="load">↻ LOAD ONLINE</button>
  <button class="btn green" id="publish">☁ PUBLISH ONLINE</button>
  <span class="status" id="status">Ready</span>
  <div class="hint">Admin panel stays unchanged below. Save your rate there first, then Publish Online. Token stays only in this browser session.</div>
</div>
<iframe class="frame" id="adminFrame" src="admin.html" title="Vishwas Rate Admin"></iframe>
<script>
const KEY="VRCL_ADMIN_DATA_V11", OWNER="vrclacc2026", REPO="VRCL-RATE", BRANCH="main", PATH="rates.json";
const $=id=>document.getElementById(id);
$("token").value=sessionStorage.getItem("VRCL_GH_TOKEN")||"";
function setStatus(t){$("status").textContent=t}
function token(){const t=$("token").value.trim();if(t)sessionStorage.setItem("VRCL_GH_TOKEN",t);return t}
function encode64(text){const bytes=new TextEncoder().encode(text);let s="";bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s)}
async function loadOnline(){setStatus("Loading…");try{const r=await fetch("rates.json?v="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();if(!d||!Array.isArray(d.products)||!d.cities)throw new Error("Invalid rates.json");localStorage.setItem(KEY,JSON.stringify(d));setStatus("Loaded online data");$("adminFrame").contentWindow.location.reload()}catch(e){setStatus("Load failed: "+e.message)}}
async function publish(){const t=token();if(!t){setStatus("Enter GitHub token");$("token").focus();return}let d;try{d=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}if(!d||!Array.isArray(d.products)||!d.cities){setStatus("No admin data. Save rates first.");return}d.updatedAt=new Date().toISOString();setStatus("Publishing…");$("publish").disabled=true;try{const api=`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`;let sha=null;const g=await fetch(api+"?ref="+encodeURIComponent(BRANCH),{headers:{Accept:"application/vnd.github+json",Authorization:`Bearer ${t}`,"X-GitHub-Api-Version":"2022-11-28"}});if(g.ok){sha=(await g.json()).sha||null}else if(g.status!==404){throw new Error("Read failed "+g.status)}const body={message:"Update daily customer rates",branch:BRANCH,content:encode64(JSON.stringify(d,null,2))};if(sha)body.sha=sha;const r=await fetch(api,{method:"PUT",headers:{Accept:"application/vnd.github+json",Authorization:`Bearer ${t}`,"X-GitHub-Api-Version":"2022-11-28","Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok){const x=await r.text();throw new Error("Publish "+r.status+" "+x.slice(0,120))}setStatus("Published • "+new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}))}catch(e){setStatus("Publish failed: "+e.message)}finally{$("publish").disabled=false}}
$("load").onclick=loadOnline;$("publish").onclick=publish;
</script>
</body>
</html>
