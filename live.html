<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vishwas Rate - Daily Customer Rate</title>
<meta name="description" content="Vishwas Refoils & Consumer Limited daily oil rates">
<style>
*{box-sizing:border-box}:root{--red:#a90d16;--red2:#df3f48;--ink:#172033;--muted:#667085;--line:#e3e7ec}body{margin:0;background:#f7f8fa;color:var(--ink);font-family:Arial,Helvetica,sans-serif}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;box-shadow:0 4px 18px #00000010}.head{max-width:1400px;margin:auto;padding:10px 18px;display:flex;align-items:center;gap:12px}.logo{width:64px;height:64px;object-fit:contain;border-radius:10px;border:1px solid #f0c4c7;background:#fff}.company{font-size:20px;font-weight:950}.sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:800}.citybar{max-width:1400px;margin:auto;padding:0 18px 12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.city{border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:8px 14px;font-weight:900;cursor:pointer;transition:.18s}.city:hover{transform:translateY(-1px)}.city.active{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;border-color:var(--red);box-shadow:0 4px 12px #a90d1630}.date{margin-left:auto;color:var(--muted);font-size:11px;font-weight:800}.live{font-size:10px;font-weight:950;color:#087f70;background:#e9f8f3;border:1px solid #bfe8da;border-radius:999px;padding:5px 8px}main{max-width:1400px;margin:16px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;box-shadow:0 7px 20px #0000000d;transition:.22s;animation:cardIn .45s ease both}.card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,#8e0000,#ef5350,#ff8a80,#ef5350,#8e0000);background-size:250% 100%;animation:redSweep 5s linear infinite}.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px #00000017;border-color:#e6a4a8}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:3px}.name{font-size:16px;font-weight:950;display:flex;align-items:center;gap:7px}.productPhoto{width:48px;height:48px;object-fit:contain;border-radius:9px;border:1px solid #efb8bc;background:#fff}.small{font-size:10px;color:var(--muted);margin-top:2px}.copy{border:0;border-radius:7px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:900;cursor:pointer;padding:6px 8px}table{width:100%;border-collapse:separate;border-spacing:0;margin-top:9px;border:1px solid #d5dde5;border-radius:8px;overflow:hidden}th,td{border:0;border-bottom:1px solid #d5dde5;padding:7px;font-size:11px}th{background:#fff0f1;color:#8e0000;font-weight:950;text-align:center}td{background:#fff;font-weight:900}td:last-child{text-align:right;color:#8e0000}tr:last-child td{border-bottom:0}.productTerms{margin-top:9px;padding:8px 9px;border-radius:8px;background:#fff8f8;border:1px solid #efc2c5;color:#394150;font-size:10px;line-height:1.45}.productTerms strong{display:block;color:#8e0000;font-size:10px;margin-bottom:3px}.productTermsLine{white-space:pre-line}.empty,.loading{grid-column:1/-1;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:35px;text-align:center;color:var(--muted)}.toast{display:none;position:fixed;right:18px;bottom:18px;background:#101827;color:#fff;padding:11px 15px;border-radius:9px;font-weight:900;z-index:50;box-shadow:0 8px 24px #0003}@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}@keyframes redSweep{0%{background-position:-250% 0}100%{background-position:250% 0}}@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.company{font-size:16px}.date{width:100%;margin-left:0}.grid{grid-template-columns:1fr}.card{padding:10px}.name{font-size:15px}.productPhoto{width:44px;height:44px}th,td{font-size:12px}}
</style>
</head>
<body>
<header><div class="head"><img class="logo" src="logo.png" alt="Vishwas Logo"><div><div class="company">VISHWAS REFOILS &amp; CONSUMER LIMITED</div><div class="sub">DAILY RATE</div></div></div><div class="citybar"><button class="city active" data-city="Rajkot">RAJKOT</button><button class="city" data-city="Ahmedabad">AHMEDABAD</button><button class="city" data-city="Udaan">UDAAN</button><span id="live" class="live">CHECKING LIVE RATE…</span><span id="date" class="date"></span></div></header>
<main><div id="products" class="grid"><div class="loading">Loading latest rates…</div></div></main><div id="toast" class="toast"></div>
<script>
const STORAGE_KEYS=["VRCL_ADMIN_DATA_V11","VRCL_ADMIN_DATA","vishwas-rate-data"],REMOTE_FILE="rates.json";let selectedCity="Rajkot",sharedData=null,lastRemoteStamp="";
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function money(x){const n=Number(x);return Number.isFinite(n)?"₹"+n.toFixed(2):"₹0.00"}function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display="none",1700)}function localFallback(){for(const k of STORAGE_KEYS){try{const x=localStorage.getItem(k);if(x)return JSON.parse(x)}catch(e){}}return null}function data(){return sharedData||localFallback()}function rows(p,cd){const d=cd[p.id]||p.cities?.[selectedCity]||p;return Array.isArray(d?.packings)?d.packings:Array.isArray(d?.rows)?d.rows:[]}function note(p,cd){const x=cd[p.id]||p.cities?.[selectedCity]||p;return x?.narration||x?.terms||x?.termsAndConditions||p?.narration||p?.terms||""}function currentDateText(){return new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"})}function buildCopyText(p,rs,n){const lines=["JAY SIYARAM","*VISHWAS REFOILS & CONSUMER LIMITED*",currentDateText(),"",p.name];rs.forEach(r=>lines.push((r.packing||r.name||"")+"    "+Number(r.newRate??r.rate??r.price??0).toFixed(2)));if(String(n||"").trim())lines.push("","TERMS & CONDITIONS",...String(n).trim().split(/\r?\n/));return lines.join("\n")}function copyRate(p,rs,n){const text=buildCopyText(p,rs,n);if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("✓ RATE COPIED")).catch(()=>fallback(text));else fallback(text)}function fallback(text){const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast("✓ RATE COPIED")}
function render(){const d=data(),root=document.getElementById("products");if(!d){root.innerHTML='<div class="empty">No published rates available yet.</div>';return}const cd=d.cities?.[selectedCity]||{};const list=(Array.isArray(d.products)?d.products:[]).filter(p=>String(p.name||"").trim()&&rows(p,cd).some(r=>String(r.packing||r.name||"").trim()));if(!list.length){root.innerHTML='<div class="empty">No rates available for '+esc(selectedCity)+'.</div>';return}root.innerHTML=list.map((p,i)=>{const rs=rows(p,cd).filter(r=>String(r.packing||r.name||"").trim()),terms=String(note(p,cd)||"").trim();return `<article class="card"><div class="top"><div><div class="name"><img class="productPhoto" src="logo.png" alt=""><span>${esc(p.name)}</span></div><div class="small">Latest published rate</div></div><button class="copy" data-i="${i}" title="Copy rate">⧉ COPY</button></div><table><thead><tr><th>PACKING</th><th>RATE</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.packing||r.name)}</td><td>${money(r.newRate??r.rate??r.price)}</td></tr>`).join("")}</tbody></table>${terms?`<div class="productTerms"><strong>TERMS &amp; CONDITIONS</strong><div class="productTermsLine">${esc(terms)}</div></div>`:""}</article>`}).join("");root.querySelectorAll(".copy").forEach((b,i)=>b.onclick=()=>{const p=list[i],rs=rows(p,cd).filter(r=>String(r.packing||r.name||"").trim());copyRate(p,rs,note(p,cd))})}
async function loadRemote(silent=false){try{const res=await fetch(REMOTE_FILE+"?v="+Date.now(),{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);const json=await res.json();if(!json||!Array.isArray(json.products)||!json.cities)throw new Error("Invalid data");sharedData=json;const stamp=String(json.updatedAt||"");document.getElementById("live").textContent=stamp?"LIVE • "+new Date(stamp).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"LIVE RATE";if(stamp!==lastRemoteStamp){lastRemoteStamp=stamp;render();if(silent)toast("✓ LATEST RATE LOADED")}}catch(e){document.getElementById("live").textContent="OFFLINE FALLBACK";if(!silent){sharedData=null;render()}}}
document.querySelectorAll(".city").forEach(b=>b.onclick=()=>{selectedCity=b.dataset.city;document.querySelectorAll(".city").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});document.getElementById("date").textContent=currentDateText();loadRemote(false);setInterval(()=>loadRemote(true),60000);
</script>
</body>
</html>
