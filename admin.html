<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vishwas Refoils & Consumer Limited - Rate Admin</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f3f6f8;color:#101828}.hidden{display:none!important}.topbar{position:sticky;top:0;z-index:50;background:#101827;color:#fff;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;gap:15px;box-shadow:0 5px 25px #0002}.brand{font-size:21px;font-weight:900}.sub{font-size:12px;color:#cbd5e1;margin-top:3px}.wrap{max-width:1500px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid #e1e7ec;border-radius:15px;padding:16px;margin-bottom:15px;box-shadow:0 5px 20px #1720330b}.title{font-weight:900;font-size:17px;margin-bottom:12px}.flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:900;cursor:pointer}.green{background:#087f70;color:#fff}.dark{background:#101827;color:#fff}.red{background:#b42318;color:#fff}.light{background:#f5f7f9;border:1px solid #ccd4dc;color:#111827}.city{padding:10px 18px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;font-weight:900;cursor:pointer}.city.active{background:#101827;color:#fff}.productList{display:flex;flex-wrap:wrap;gap:8px}.productBtn{padding:10px 17px;border:1px solid #cbd5e1;background:#fff;border-radius:9px;font-weight:900;cursor:pointer}.productBtn.active{background:#087f70;color:#fff;border-color:#087f70}.masterRow{background:#fff9ec;border:1px solid #ead49a;border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.masterName{font-weight:900}.hint{font-size:12px;color:#667085}.masterInput{width:170px;font-weight:900}input,select,textarea{font:inherit;border:1px solid #cbd5e1;border-radius:8px;padding:9px;background:#fff;outline:none}.preview{display:flex;gap:6px;align-items:center}.excelStrip{display:grid;grid-template-columns:150px 82px 112px;gap:5px;background:#fffdf8;border:1px solid #efc492;border-radius:9px;padding:5px}.excelBox{border:1px solid #d8dee7;border-radius:8px;overflow:hidden;background:#fff}.excelHead{background:#f5b27e;color:#171717;padding:4px 6px;font-size:9px;font-weight:950}.excelValue{padding:5px 7px;font-size:14px;font-weight:950;min-height:30px;display:flex;align-items:center}.excelEdit{width:100%;border:0!important;border-radius:0!important;padding:5px 7px!important}.diffValue{color:#087f70}.tableWrap{overflow:auto;border:1px solid #dde3e8;border-radius:11px}table{border-collapse:collapse;width:100%;min-width:1180px}th,td{padding:8px;border-bottom:1px solid #e7ebef;text-align:left;vertical-align:middle}th{background:#eef1f4;font-size:12px;white-space:nowrap}td input,td select{width:100%;min-width:125px}.newRate{background:#e7f7ee!important;font-weight:900}.note{margin-top:15px;padding:13px;border-radius:11px;background:#fafafa;border:1px solid #e1e5e9}.note textarea{width:100%;min-height:105px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}.toast{position:fixed;right:20px;bottom:20px;z-index:999;background:#101827;color:#fff;padding:14px 18px;border-radius:10px;font-weight:900;display:none}.loginOverlay{position:fixed;inset:0;z-index:9999;background:#101827dd;display:flex;align-items:center;justify-content:center;padding:20px}.loginBox{background:#fff;width:min(430px,100%);border-radius:16px;padding:20px;box-shadow:0 20px 70px #0005}.field{margin-top:12px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:4px}.field input{width:100%}.error{color:#b42318;font-size:12px;font-weight:800;margin-top:8px}.empty{padding:25px;text-align:center;color:#667085}@media(max-width:850px){.topbar{padding:12px}.brand{font-size:16px}.wrap{padding:0 8px}.preview{flex-basis:100%;overflow:auto}}</style></head><body><div id="loginOverlay" class="loginOverlay"><div class="loginBox"><div class="title">ADMIN LOGIN</div><div class="field"><label>EMAIL</label><input id="email" type="email"></div><div class="field"><label>PASSWORD</label><input id="password" type="password"></div><button id="loginBtn" class="btn green" style="width:100%;margin-top:12px">LOGIN</button><div id="loginMsg" class="error"></div></div></div><header class="topbar"><div><div class="brand">VISHWAS REFOILS &amp; CONSUMER LIMITED</div><div class="sub">Private Rate Administration Panel</div></div><div class="flex"><span>SECURE RATE ADMIN</span><button id="logout" class="btn red hidden">LOGOUT</button></div></header><main class="wrap"><section class="card"><div class="title">CITY</div><div class="flex" id="cityArea"></div></section><section class="card"><div class="title">PRODUCTS</div><div class="productList" id="productArea"></div></section><section class="card"><div class="masterRow"><div><div class="masterName">🛢️ LOOSE OIL RATE</div><div class="hint">Master rate per 10 KG</div></div><input id="looseRate" class="masterInput" type="number" step="0.01" placeholder="Enter rate"><div class="preview"><div class="excelStrip"><div class="excelBox"><div class="excelHead">FORMULA</div><input class="excelEdit" id="pvFormula" value="MASTER*1"></div><div class="excelBox"><div class="excelHead">R OFF</div><input class="excelEdit" id="pvRound" type="number" step="0.01" value="0"></div><div class="excelBox"><div class="excelHead">DIFF</div><div class="excelValue diffValue" id="pvDiff">—</div></div></div></div></div></section><section class="card"><div class="title">RATE SETUP</div><div class="tableWrap"><table><thead><tr><th>PACKING</th><th>MASTER LINK</th><th>OLD RATE</th><th>FORMULA</th><th>EXTRA COSTING</th><th>ROUND OFF</th><th>NEW RATE</th><th>ACTION</th></tr></thead><tbody id="rateBody"></tbody></table></div><div class="actions"><button class="btn green" id="addPacking">＋ ADD PACKING / WEIGHT</button><button class="btn dark" id="saveAll">💾 SAVE ALL</button></div><div class="note"><label><b>📝 NARRATION / TERMS & CONDITIONS</b></label><textarea id="narration"></textarea><div class="actions"><button class="btn light" id="saveNote">💾 SAVE NARRATION</button></div></div></section></main><div id="toast" class="toast"></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import{SUPABASE_URL,SUPABASE_ANON_KEY}from'./supabase-config.js';const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY),$=id=>document.getElementById(id);let city='Rajkot',products=[],productId='',rows=[];const META='VISHWAS_RATE_ADMIN_META_V1';let meta={};try{meta=JSON.parse(localStorage.getItem(META)||'{}')}catch{}function saveMeta(){localStorage.setItem(META,JSON.stringify(meta))}function k(){return city+'|'+productId}function st(){return meta[k()]||(meta[k()]={looseRate:'',masterFormula:'MASTER*1',masterRound:0,rows:{}})}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1800)}function calcFormula(formula,master){let f=String(formula||'').trim().toUpperCase();if(!f)return Number(master)||0;if(/^[+\-*/]/.test(f))f='MASTER'+f;f=f.replace(/MASTER/g,'('+(Number(master)||0)+')');if(!/^[0-9+\-*/().\s]+$/.test(f))return 0;try{const n=Function('"use strict";return ('+f+')')();return Number.isFinite(Number(n))?Number(n):0}catch{return 0}}function roundValue(v,r){const s=Math.abs(Number(r));return s?Math.floor((Number(v)+1e-9)/s)*s:Number(v)||0}function calcRow(r){const s=st();return roundValue(calcFormula(r.formula||'MASTER*1',s.looseRate)+Number(r.extra||0),r.round||0)}async function adminCheck(){const{data:{session}}=await supabase.auth.getSession();if(!session)return false;const{data:p}=await supabase.from('profiles').select('role,active').eq('id',session.user.id).single();if(!p||p.role!=='admin'||!p.active){await supabase.auth.signOut({scope:'local'});return false}$('loginOverlay').classList.add('hidden');$('logout').classList.remove('hidden');await loadProducts();return true}async function loadProducts(){const{data,error}=await supabase.from('products').select('*').eq('active',true).order('sort_order');if(error){toast('Products load failed');return}products=data||[];if(!productId)productId=products[0]?.id||'';renderCities();renderProducts();await loadRates()}function renderCities(){$('cityArea').innerHTML=['Rajkot','Ahmedabad','Udaan'].map(c=>`<button class="city ${c===city?'active':''}" data-city="${c}">${c}</button>`).join('');document.querySelectorAll('[data-city]').forEach(b=>b.onclick=async()=>{city=b.dataset.city;renderCities();await loadRates()})}function renderProducts(){$('productArea').innerHTML=products.map(p=>`<button class="productBtn ${p.id===productId?'active':''}" data-product="${p.id}">${esc(p.name)}</button>`).join('')||'<div class="empty">No products.</div>';document.querySelectorAll('[data-product]').forEach(b=>b.onclick=async()=>{productId=b.dataset.product;renderProducts();await loadRates()})}async function loadRates(){if(!productId){rows=[];renderTable();return}const{data,error}=await supabase.from('rates').select('*').eq('city',city).eq('product_id',productId).order('sort_order');if(error){toast('Rate load failed');return}const s=st();rows=(data||[]).map((r,i)=>{const m=s.rows[r.packing]||{};return{id:r.id,packing:r.packing,oldRate:r.rate,formula:m.formula||'MASTER*1',extra:m.extra||0,round:m.round||0,narration:r.narration||'',sort_order:r.sort_order??i}});$('narration').value=rows[0]?.narration||'';$('looseRate').value=s.looseRate;$('pvFormula').value=s.masterFormula||'MASTER*1';$('pvRound').value=s.masterRound||0;updatePreview();renderTable()}function updatePreview(){const s=st();$('pvDiff').textContent=roundValue(calcFormula(s.masterFormula||'MASTER*1',s.looseRate),s.masterRound||0).toFixed(2)}function renderTable(){if(!productId){$('rateBody').innerHTML='<tr><td colspan="8" class="empty">Select product.</td></tr>';return}if(!rows.length){$('rateBody').innerHTML='<tr><td colspan="8" class="empty">No packing yet. Click ADD PACKING.</td></tr>';return}$('rateBody').innerHTML=rows.map((r,i)=>`<tr><td><input data-i="${i}" data-f="packing" value="${esc(r.packing)}"></td><td><select disabled><option>LOOSE OIL RATE</option></select></td><td><input value="${Number(r.oldRate||0).toFixed(2)}" disabled></td><td><input data-i="${i}" data-f="formula" value="${esc(r.formula)}"></td><td><input type="number" data-i="${i}" data-f="extra" value="${esc(r.extra)}"></td><td><input type="number" data-i="${i}" data-f="round" value="${esc(r.round)}"></td><td><input class="newRate" data-new="${i}" value="${calcRow(r).toFixed(2)}" disabled></td><td><button class="btn light" data-del="${i}">🗑️</button></td></tr>`).join('');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{const i=Number(b.dataset.del),r=rows[i];if(r.id){const{error}=await supabase.from('rates').delete().eq('id',r.id);if(error){toast(error.message);return}}rows.splice(i,1);renderTable();toast('Packing deleted')})}function sync(el){const r=rows[Number(el.dataset.i)];if(r)r[el.dataset.f]=el.value}function refresh(){rows.forEach((r,i)=>{const el=document.querySelector(`[data-new="${i}"]`);if(el)el.value=calcRow(r).toFixed(2)})}$('rateBody').addEventListener('input',e=>{const el=e.target.closest('[data-i]');if(!el)return;sync(el);refresh()});$('looseRate').addEventListener('input',e=>{st().looseRate=e.target.value;saveMeta();updatePreview();refresh()});$('pvFormula').addEventListener('input',e=>{st().masterFormula=e.target.value;saveMeta();updatePreview()});$('pvRound').addEventListener('input',e=>{st().masterRound=e.target.value;saveMeta();updatePreview()});$('addPacking').onclick=()=>{rows.push({id:null,packing:'',oldRate:0,formula:'MASTER*1',extra:0,round:0,narration:$('narration').value,sort_order:rows.length+1});renderTable()};$('saveAll').onclick=async()=>{if(!productId)return;const s=st(),narr=$('narration').value;for(let i=0;i<rows.length;i++){const r=rows[i],rate=calcRow(r);if(!r.packing.trim())continue;s.rows[r.packing]={formula:r.formula,extra:r.extra,round:r.round};const payload={city,product_id:productId,packing:r.packing.trim(),rate,narration:narr,sort_order:i+1};const{error}=await supabase.from('rates').upsert(payload,{onConflict:'city,product_id,packing'});if(error){toast(error.message);return}}saveMeta();toast('✅ RATE UPDATE SAVED');await loadRates()};$('saveNote').onclick=async()=>{const narr=$('narration').value;for(const r of rows){if(r.id)await supabase.from('rates').update({narration:narr}).eq('id',r.id)}toast('✅ NARRATION SAVED')};$('loginBtn').onclick=async()=>{const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').textContent='Invalid admin login.';return}if(!await adminCheck())$('loginMsg').textContent='Admin access denied.'};$('logout').onclick=async()=>{await supabase.auth.signOut({scope:'local'});location.reload()};adminCheck();</script></body></html>
