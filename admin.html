<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vishwas Refoils — Admin Rate Panel</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f6f8;color:#222}
header{background:#111827;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:15px}
.brand{font-size:20px;font-weight:900}.sub{font-size:12px;opacity:.7;margin-top:3px}
.wrap{max-width:1450px;margin:20px auto;padding:0 16px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 4px 15px rgba(0,0,0,.04)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
button,input,select{font:inherit}
button{cursor:pointer}
.btn{border:0;border-radius:9px;padding:9px 13px;font-weight:800}
.btn-dark{background:#111827;color:#fff}.btn-green{background:#0f766e;color:#fff}.btn-red{background:#b91c1c;color:#fff}.btn-light{background:#f3f4f6;color:#111827;border:1px solid #d1d5db}
.btn:disabled{opacity:.5;cursor:not-allowed}
.section-title{font-weight:900;font-size:15px;margin-bottom:10px}
.city-btn,.cat-btn{padding:9px 14px;border:1px solid #d1d5db;background:#fff;border-radius:9px;font-weight:800}
.city-btn.active,.cat-btn.active{background:#111827;color:#fff;border-color:#111827}
.cat-item{display:flex;align-items:center;gap:4px}
.small{padding:6px 8px!important;font-size:12px}
.category-list{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.loose{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fffaf0;border:1px solid #ead9aa;border-radius:12px;padding:14px}
.loose-title{font-weight:900}.hint{font-size:12px;color:#777}
.loose input{width:180px;padding:10px;border:1px solid #cfd4dc;border-radius:8px;font-weight:800}
.lock{border:1px solid #cfd4dc;background:#fff;border-radius:8px;padding:9px 12px;font-weight:800}
.lock.on{background:#111827;color:#fff}
.table-wrap{overflow:auto;border:1px solid #e5e7eb;border-radius:12px}
table{width:100%;min-width:1050px;border-collapse:collapse;background:#fff}
th,td{padding:9px;border-bottom:1px solid #eee;text-align:left;vertical-align:middle}
th{background:#f8fafc;font-size:12px;white-space:nowrap}
td input,td select{width:100%;min-width:120px;padding:8px;border:1px solid #d1d5db;border-radius:7px;background:#fff}
td input:disabled,td select:disabled{background:#f1f3f5;color:#777}
.newrate{font-weight:900;background:#f0fdf4!important}
.lock-btn{font-size:11px;padding:4px 7px;margin-top:4px;border:1px solid #d1d5db;border-radius:6px;background:#fff}
.lock-btn.on{background:#111827;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.notice{position:fixed;right:22px;bottom:22px;background:#111827;color:#fff;padding:13px 17px;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:none;z-index:1000;font-weight:800}
.empty{text-align:center;padding:35px;color:#777}
</style>
</head>
<body>
<header>
  <div><div class="brand">VISHWAS REFOILS & CONSUMER LIMITED</div><div class="sub">Private Rate Administration Panel</div></div>
  <div class="row">
    <span id="statusText">LOCKED</span>
    <button class="btn btn-dark" id="adminLockBtn" onclick="toggleAdmin()">🔓 UNLOCK ADMIN</button>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <div class="section-title">CITY</div>
    <div class="row" id="cityList"></div>
  </div>

  <div class="card">
    <div class="section-title">PRODUCT CATEGORY</div>
    <div class="category-list" id="categoryList"></div>
    <div class="actions">
      <button class="btn btn-green" onclick="addCategory()">＋ ADD PRODUCT CATEGORY</button>
    </div>
  </div>

  <div class="card">
    <div class="loose">
      <div>
        <div class="loose-title">🛢️ LOOSE OIL RATE</div>
        <div class="hint">Master rate per 10 KG</div>
      </div>
      <input id="looseRate" type="number" step="0.01" placeholder="Enter master rate">
      <button class="lock" id="looseLock" onclick="toggleLooseLock()">🔓 MASTER LOCK</button>
    </div>
  </div>

  <div class="card">
    <div class="section-title">RATE SETUP</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>PACKING<br><button class="lock-btn" data-lock="packing" onclick="toggleField('packing')">🔓</button></th>
            <th>MASTER LINK<br><button class="lock-btn" data-lock="master" onclick="toggleField('master')">🔓</button></th>
            <th>OLD RATE<br><button class="lock-btn" data-lock="old" onclick="toggleField('old')">🔓</button></th>
            <th>FORMULA<br><button class="lock-btn" data-lock="formula" onclick="toggleField('formula')">🔓</button></th>
            <th>EXTRA COSTING<br><button class="lock-btn" data-lock="extra" onclick="toggleField('extra')">🔓</button></th>
            <th>ROUND OFF<br><button class="lock-btn" data-lock="round" onclick="toggleField('round')">🔓</button></th>
            <th>NEW RATE</th><th>ACTION</th>
          </tr>
        </thead>
        <tbody id="rateBody"></tbody>
      </table>
    </div>
    <div class="actions">
      <button class="btn btn-green" onclick="addPacking()">＋ ADD PACKING / WEIGHT</button>
      <button class="btn btn-dark" onclick="saveAll()">💾 SAVE ALL</button>
    </div>
  </div>
</div>
<div class="notice" id="notice"></div>

<script>
const KEY="VRCL_RATE_ADMIN_V6";
let unlocked=false;
let city="Rajkot";
let category="";
let db={cities:{Rajkot:{},Ahmedabad:{},Udaan:{}}};

const defaultState=()=>({
  cities:{Rajkot:{},Ahmedabad:{},Udaan:{}},
  categories:[]
});

function loadDB(){
  try{
    const raw=localStorage.getItem(KEY);
    db=raw?JSON.parse(raw):defaultState();
  }catch(e){db=defaultState()}
  if(!db.cities) db=defaultState();
  ["Rajkot","Ahmedabad","Udaan"].forEach(c=>db.cities[c] ||= {});
  if(!Array.isArray(db.categories))db.categories=[];
}
function saveDB(){localStorage.setItem(KEY,JSON.stringify(db))}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function money(v){return Number(v||0).toFixed(2)}
function msg(t){const n=document.getElementById("notice");n.textContent=t;n.style.display="block";setTimeout(()=>n.style.display="none",1800)}

function toggleAdmin(){
 unlocked=!unlocked;
 document.getElementById("statusText").textContent=unlocked?"UNLOCKED":"LOCKED";
 document.getElementById("adminLockBtn").textContent=unlocked?"🔒 LOCK ADMIN":"🔓 UNLOCK ADMIN";
 render();
}
function ensureAccess(){if(!unlocked){msg("🔒 Unlock Admin first");return false}return true}

function renderCities(){
 document.getElementById("cityList").innerHTML=["Rajkot","Ahmedabad","Udaan"].map(c=>
 `<button class="city-btn ${c===city?"active":""}" onclick="setCity('${c}')">${c}</button>`).join("");
}
function setCity(c){city=c;render()}

function renderCategories(){
 const el=document.getElementById("categoryList");
 el.innerHTML=db.categories.map(c=>`<div class="cat-item">
   <button class="cat-btn ${c.id===category?"active":""}" onclick="setCategory('${c.id}')">${esc(c.name)}</button>
   <button class="btn btn-light small" onclick="editCategory('${c.id}')">✏️</button>
   <button class="btn btn-light small" onclick="deleteCategory('${c.id}')">🗑️</button>
 </div>`).join("");
 if(!db.categories.length)el.innerHTML='<div class="empty">No product category yet. Click “＋ ADD PRODUCT CATEGORY” to start.</div>';
}
function addCategory(){
 if(!ensureAccess())return;
 const n=prompt("Product Category Name:");
 if(!n||!n.trim())return;
 const id="c_"+Date.now();
 db.categories.push({id,name:n.trim()});
 ["Rajkot","Ahmedabad","Udaan"].forEach(c=>db.cities[c][id]={looseRate:"",packings:[]});
 category=id;saveDB();render();msg("✅ Product category added");
}
function editCategory(id){
 if(!ensureAccess())return;
 const c=db.categories.find(x=>x.id===id);if(!c)return;
 const n=prompt("Edit Product Category:",c.name);
 if(!n||!n.trim())return;
 c.name=n.trim();saveDB();render();msg("✅ Category updated");
}
function deleteCategory(id){
 if(!ensureAccess())return;
 const c=db.categories.find(x=>x.id===id);if(!c)return;
 if(!confirm("Delete "+c.name+" and all its rate data?"))return;
 db.categories=db.categories.filter(x=>x.id!==id);
 ["Rajkot","Ahmedabad","Udaan"].forEach(x=>delete db.cities[x][id]);
 category=db.categories[0]?.id||"";saveDB();render();msg("🗑️ Category deleted");
}
function setCategory(id){category=id;render()}

function current(){
 if(!category)return null;
 db.cities[city][category] ||= {looseRate:"",packings:[]};
 db.cities[city][category].packings ||= [];
 return db.cities[city][category];
}
function getLocks(){
 return JSON.parse(localStorage.getItem("VRCL_FIELD_LOCKS_V6")||'{"packing":false,"master":false,"old":false,"formula":false,"extra":false,"round":false}');
}
function toggleField(f){
 if(!ensureAccess())return;
 const l=getLocks();l[f]=!l[f];localStorage.setItem("VRCL_FIELD_LOCKS_V6",JSON.stringify(l));render();
}
function looseLocked(){return localStorage.getItem("VRCL_LOOSE_LOCK_V6")==="1"}
function toggleLooseLock(){
 if(!ensureAccess())return;
 localStorage.setItem("VRCL_LOOSE_LOCK_V6",looseLocked()?"0":"1");render();
}

function masterRate(link){
 const d=current();if(!d)return 0;
 if(link==="LOOSE OIL RATE")return Number(d.looseRate)||0;
 const r=d.packings.find(x=>x.packing===link);
 return r?Number(r.newRate)||0:0;
}
function calc(formula,master){
 let f=String(formula||"").trim().toUpperCase();
 if(!f)return Number(master)||0;
 f=f.replace(/MASTER/g,"("+Number(master||0)+")").replace(/,/g,"");
 if(!/^[0-9+\\-*/().\\s]+$/.test(f))return 0;
 try{let n=Function('"use strict";return '+f)();return Number.isFinite(n)?n:0}catch(e){return 0}
}
function roundValue(v,r){
 const step=Number(r);
 if(!step)return Number(v);
 return Math.round(Number(v)/step)*step;
}
function newRate(row){
 const m=masterRate(row.master||"LOOSE OIL RATE");
 const base=calc(row.formula,m);
 return roundValue(base+Number(row.extra||0),row.round);
}

function render(){
 loadDB();renderCities();renderCategories();
 const d=current();
 const lr=document.getElementById("looseRate");
 if(lr){
   lr.value=d?d.looseRate:"";
   lr.disabled=!unlocked||looseLocked();
 }
 const lb=document.getElementById("looseLock");
 lb.textContent=looseLocked()?"🔒 MASTER LOCKED":"🔓 MASTER LOCK";
 lb.classList.toggle("on",looseLocked());

 const locks=getLocks();
 document.querySelectorAll("[data-lock]").forEach(b=>{
   const on=!!locks[b.dataset.lock];b.textContent=on?"🔒":"🔓";b.classList.toggle("on",on);
 });

 const body=document.getElementById("rateBody");
 if(!d){body.innerHTML='<tr><td colspan="8" class="empty">First create a PRODUCT CATEGORY.</td></tr>';return}
 if(!d.packings.length){body.innerHTML='<tr><td colspan="8" class="empty">No packing added. Click “＋ ADD PACKING / WEIGHT”.</td></tr>';return}

 body.innerHTML=d.packings.map((r,i)=>{
   const nr=newRate(r);
   return `<tr>
    <td><input data-i="${i}" data-f="packing" value="${esc(r.packing)}" ${!unlocked||locks.packing?"disabled":""}></td>
    <td><select data-i="${i}" data-f="master" ${!unlocked||locks.master?"disabled":""}>
      <option value="LOOSE OIL RATE">LOOSE OIL RATE</option>
      ${d.packings.filter((x,j)=>j!==i&&x.packing).map(x=>`<option value="${esc(x.packing)}" ${r.master===x.packing?"selected":""}>${esc(x.packing)}</option>`).join("")}
    </select></td>
    <td><input type="number" step="0.01" data-i="${i}" data-f="old" value="${r.oldRate??""}" ${!unlocked||locks.old?"disabled":""}></td>
    <td><input data-i="${i}" data-f="formula" value="${esc(r.formula||"MASTER*1")}" placeholder="MASTER*3 / -100" ${!unlocked||locks.formula?"disabled":""}></td>
    <td><input type="number" step="0.01" data-i="${i}" data-f="extra" value="${r.extra??0}" ${!unlocked||locks.extra?"disabled":""}></td>
    <td><input type="number" step="0.01" data-i="${i}" data-f="round" value="${r.round??0}" placeholder="0.10" ${!unlocked||locks.round?"disabled":""}></td>
    <td><input class="newrate" value="${money(nr)}" disabled></td>
    <td><button class="btn btn-light small" onclick="deletePacking(${i})">🗑️</button></td>
   </tr>`;
 }).join("");

 if(unlocked && !looseLocked()){
   lr.oninput=()=>{d.looseRate=lr.value;saveDB();refreshNewRates()}
 }else if(lr)lr.oninput=null;
}
function refreshNewRates(){
 const d=current();if(!d)return;
 document.querySelectorAll("#rateBody tr").forEach((tr,i)=>{
   const input=tr.querySelector(".newrate");if(input)input.value=money(newRate(d.packings[i]));
 });
}
function syncInputs(){
 const d=current();if(!d)return;
 document.querySelectorAll("#rateBody [data-i]").forEach(el=>{
   const i=Number(el.dataset.i),f=el.dataset.f;
   if(d.packings[i])d.packings[i][f]=el.value;
 });
 saveDB();refreshNewRates();
}
document.addEventListener("input",e=>{
 if(e.target.matches("#rateBody [data-i]"))syncInputs();
});
document.addEventListener("change",e=>{
 if(e.target.matches("#rateBody [data-i]"))syncInputs();
});

function addPacking(){
 if(!ensureAccess())return;
 const d=current();if(!d){msg("First add a product category");return}
 d.packings.push({packing:"",master:"LOOSE OIL RATE",oldRate:"",formula:"MASTER*1",extra:0,round:0});
 saveDB();render();msg("✅ Packing row added");
}
function deletePacking(i){
 if(!ensureAccess())return;
 const d=current();if(!d)return;
 if(!confirm("Delete this packing?"))return;
 d.packings.splice(i,1);saveDB();render();msg("🗑️ Packing deleted");
}
function saveAll(){
 if(!ensureAccess())return;
 syncInputs();msg("✅ RATE SAVED SUCCESSFULLY");
}
loadDB();
render();
</script>
</body>
</html>
