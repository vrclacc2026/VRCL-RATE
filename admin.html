<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishwas Rate - Admin Panel</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef1f5;
    color:#222;
}

.header{
    background:#8b0000;
    color:#fff;
    padding:14px 20px;
}

.header-inner{
    max-width:1500px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:24px;
    font-weight:800;
}

.admin{
    font-size:13px;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:16px;
}

.card{
    background:#fff;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.section-title{
    font-weight:bold;
    margin-bottom:10px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.btn{
    border:1px solid #ccc;
    background:#fff;
    padding:9px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#f2f2f2;
}

.btn.active{
    background:#8b0000;
    color:#fff;
    border-color:#8b0000;
}

.control-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:15px;
}

.lock-btn,
.save-btn{
    border:0;
    padding:11px 22px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.locked{
    background:#333;
    color:#fff;
}

.unlocked{
    background:#d99b00;
    color:#fff;
}

.save-btn{
    background:#148650;
    color:#fff;
}

.save-btn:disabled{
    background:#aaa;
    cursor:not-allowed;
}

/* MASTER */

.master-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

.master-card{
    background:#fff;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.master-title{
    font-size:17px;
    font-weight:bold;
    color:#8b0000;
    margin-bottom:12px;
}

.master-fields{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:9px;
    border:1px solid #bbb;
    border-radius:6px;
    font-size:14px;
}

input:disabled,
select:disabled{
    background:#eee;
    color:#777;
}

.new-master{
    background:#e7f7ed !important;
    font-weight:bold;
}

/* TABLE */

.table-card{
    background:#fff;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.table-title{
    padding:14px 15px;
    background:#222;
    color:#fff;
    font-weight:bold;
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
}

th{
    background:#e7e7e7;
    padding:10px 8px;
    border-bottom:1px solid #ccc;
    font-size:12px;
    text-align:left;
}

td{
    padding:7px 8px;
    border-bottom:1px solid #eee;
}

td:first-child{
    font-weight:bold;
}

.rate-new{
    background:#e7f7ed;
    font-weight:bold;
}

.rate-link{
    background:#dcecff;
}

.round{
    background:#f5f5f5;
}

/* HISTORY */

.history-card{
    background:#fff;
    margin-top:15px;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.history-title{
    padding:14px;
    background:#1267a8;
    color:#fff;
    font-weight:bold;
}

.history-item{
    padding:12px 14px;
    border-bottom:1px solid #eee;
}

.history-product{
    font-weight:bold;
}

.history-date{
    font-size:12px;
    color:#777;
    margin-top:4px;
}

.old-history{
    color:#b00000;
    font-weight:bold;
}

.new-history{
    color:#08783e;
    font-weight:bold;
}

.empty-history{
    padding:20px;
    color:#777;
    text-align:center;
}

/* MESSAGE */

.message{
    display:none;
    position:fixed;
    right:20px;
    bottom:20px;
    background:#148650;
    color:#fff;
    padding:14px 20px;
    border-radius:8px;
    box-shadow:0 4px 15px rgba(0,0,0,.25);
    font-weight:bold;
    z-index:9999;
}

@media(max-width:850px){

    .master-grid{
        grid-template-columns:1fr;
    }

    .master-fields{
        grid-template-columns:1fr;
    }

    .container{
        padding:9px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">VISHWAS RATE</div>
        <div class="admin">ADMIN PANEL</div>
    </div>
</header>

<div class="container">

<!-- CITY -->

<div class="card">

<div class="section-title">
CITY / PARTY
</div>

<div class="buttons">

<button class="btn active city-btn" id="city-rajkot"
onclick="setCity('rajkot')">
RAJKOT
</button>

<button class="btn city-btn" id="city-ahmedabad"
onclick="setCity('ahmedabad')">
AHMEDABAD
</button>

<button class="btn city-btn" id="city-udaan"
onclick="setCity('udaan')">
UDAAN
</button>

</div>

</div>


<!-- PRODUCT -->

<div class="card">

<div class="section-title">
PRODUCT
</div>

<div class="buttons">

<button class="btn active product-btn"
data-product="palm"
onclick="setProduct('palm')">
PALM
</button>

<button class="btn product-btn"
data-product="visvita"
onclick="setProduct('visvita')">
VISVITA
</button>

<button class="btn product-btn"
data-product="soya"
onclick="setProduct('soya')">
SOYA
</button>

<button class="btn product-btn"
data-product="sunflower"
onclick="setProduct('sunflower')">
SUNFLOWER
</button>

<button class="btn product-btn"
data-product="groundnut"
onclick="setProduct('groundnut')">
GROUNDNUT
</button>

<button class="btn product-btn"
data-product="cotton"
onclick="setProduct('cotton')">
COTTONSEED
</button>

<button class="btn product-btn"
data-product="mustard"
onclick="setProduct('mustard')">
MUSTARD
</button>

</div>

</div>


<!-- LOCK SAVE -->

<div class="control-bar">

<button
id="lockButton"
class="lock-btn locked"
onclick="toggleLock()">
🔒 LOCKED
</button>

<button
id="saveButton"
class="save-btn"
onclick="saveRates()"
disabled>
SAVE RATE UPDATE
</button>

</div>


<!-- MASTER -->

<div class="master-grid">

<!-- 15 KG MASTER -->

<div class="master-card">

<div class="master-title">
15 KG MASTER
</div>

<div class="master-fields">

<div>
<label>OLD RATE</label>

<input
type="number"
step="0.01"
id="master15Old"
disabled
>
</div>

<div>
<label>CHANGE (+ / -)</label>

<input
type="number"
step="0.01"
id="master15Change"
value="0"
disabled
oninput="calculateRows()"
>
</div>

<div>
<label>NEW RATE</label>

<input
type="number"
step="0.01"
id="master15New"
class="new-master"
disabled
>
</div>

</div>

</div>


<!-- 1 LTR MASTER -->

<div class="master-card">

<div class="master-title">
1 LTR MASTER
</div>

<div class="master-fields">

<div>
<label>OLD RATE</label>

<input
type="number"
step="0.01"
id="master1Old"
disabled
>
</div>

<div>
<label>CHANGE (+ / -)</label>

<input
type="number"
step="0.01"
id="master1Change"
value="0"
disabled
oninput="calculateRows()"
>
</div>

<div>
<label>NEW RATE</label>

<input
type="number"
step="0.01"
id="master1New"
class="new-master"
disabled
>
</div>

</div>

</div>

</div>


<!-- RATE TABLE -->

<div class="table-card">

<div
class="table-title"
id="productTitle">
PALM — RAJKOT — PACKING RATE FORMULA
</div>

<div class="table-wrap">

<table>

<thead>

<tr>

<th>PACKING</th>
<th>OLD RATE</th>
<th>MASTER LINK</th>
<th>RATE CHANGE</th>
<th>ROUND OFF</th>
<th>NEW RATE</th>

</tr>

</thead>

<tbody id="rateRows"></tbody>

</table>

</div>

</div>


<!-- HISTORY -->

<div class="history-card">

<div class="history-title">
📋 RATE CHANGE HISTORY — LAST 3 DAYS
</div>

<div id="historyList"></div>

</div>

</div>


<div id="message" class="message">
RATE UPDATED SUCCESSFULLY
</div>


<script>

/* =========================================================
   DEFAULT PRODUCT PACKINGS
========================================================= */

const PALM_PACKINGS = [

["15 KG N TIN",2384.00],
["15 KG S T TIN",2339.00],
["15 LTR N TIN",2174.00],
["15 LTR S TIN",2129.00],
["5 LTR JAR",731.00],
["4.150 KG JAR",701.00],
["2 LTR JAR",299.46],
["1.6 KG JAR",274.46],
["1 LTR BOTTLE",146.20],
["1 LTR POUCH",141.20],
["790 GM BOTTLE",136.20],
["750 GM POUCH",124.70],
["500 ML BOTTLE",74.60],
["500 ML POUCH",72.10],
["395 GM BOTTLE",69.60]

];


const VISVITA_PACKINGS = [

["15 KG OLD TIN",0],
["15 KG NEW TIN",0]

];


const PRODUCTS = {

palm:{
name:"PALM",
rates:PALM_PACKINGS
},

visvita:{
name:"VISVITA",
rates:VISVITA_PACKINGS
},

soya:{
name:"SOYA",
rates:PALM_PACKINGS
},

sunflower:{
name:"SUNFLOWER",
rates:PALM_PACKINGS
},

groundnut:{
name:"GROUNDNUT",
rates:PALM_PACKINGS
},

cotton:{
name:"COTTONSEED",
rates:PALM_PACKINGS
},

mustard:{
name:"MUSTARD",
rates:PALM_PACKINGS
}

};


/* =========================================================
   STATE
========================================================= */

let city = "rajkot";
let product = "palm";
let isLocked = true;


/* =========================================================
   DATABASE
========================================================= */

let db =
JSON.parse(
localStorage.getItem(
"VISHWAS_RATE_DATABASE_V4"
)
) || {};


/* =========================================================
   HISTORY
========================================================= */

let history =
JSON.parse(
localStorage.getItem(
"VISHWAS_RATE_HISTORY_V4"
)
) || [];


/* =========================================================
   GET PRODUCT DATA
========================================================= */

function getProduct(){

    if(!db[city]){
        db[city] = {};
    }

    if(!db[city][product]){

        db[city][product] = {

            rates:
            JSON.parse(
                JSON.stringify(
                    PRODUCTS[product].rates
                )
            ),

            master15Change:0,
            master1Change:0

        };

    }

    return db[city][product];
}


/* =========================================================
   MASTER TYPE
========================================================= */

function getDefaultMaster(name){

    const n =
    name.toLowerCase();

    if(
        n.includes("15 kg") ||
        n.includes("15kg") ||
        n.includes("15 ltr")
    ){

        return "15KG";

    }

    return "1LTR";
}


/* =========================================================
   DEFAULT LINK
========================================================= */

function getDefaultLink(name){

    const n =
    name.toLowerCase();


    /* BIG PACK */

    if(
        n.includes("15 kg") ||
        n.includes("15kg") ||
        n.includes("15 ltr")
    ){

        return 1;
    }


    /* 5 LTR */

    if(
        n.includes("5 ltr") ||
        n.includes("4.150")
    ){

        return 5;
    }


    /* 2 LTR */

    if(
        n.includes("2 ltr") ||
        n.includes("1.6")
    ){

        return 2;
    }


    /* 1 LTR */

    if(
        n.includes("1 ltr") ||
        n.includes("790") ||
        n.includes("750")
    ){

        return 1;
    }


    /* SMALL */

    if(
        n.includes("500") ||
        n.includes("395")
    ){

        return 0.5;
    }


    return 1;
}


/* =========================================================
   DEFAULT ROUND OFF
========================================================= */

function getDefaultRound(name){

    const n =
    name.toLowerCase();


    /* 15 KG */

    if(
        n.includes("15 kg") ||
        n.includes("15kg") ||
        n.includes("15 ltr")
    ){

        return 1;
    }


    /* 5 LTR */

    if(
        n.includes("5 ltr") ||
        n.includes("4.150")
    ){

        return 0.5;
    }


    /* SMALL */

    return 0.10;
}


/* =========================================================
   ROUND RATE
========================================================= */

function roundRate(value,round){

    if(!round || round <= 0){

        return Number(
            value.toFixed(2)
        );

    }

    return Number(
        (
            Math.round(
                value / round
            ) * round
        ).toFixed(2)
    );
}


/* =========================================================
   CITY
========================================================= */

function setCity(value){

    city = value;

    document
    .querySelectorAll(".city-btn")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    document
    .getElementById("city-"+city)
    .classList.add("active");

    load();
}


/* =========================================================
   PRODUCT
========================================================= */

function setProduct(value){

    product = value;

    document
    .querySelectorAll(".product-btn")
    .forEach(btn=>{
        btn.classList.remove("active");
    });

    document
    .querySelector(
        '[data-product="'+product+'"]'
    )
    .classList.add("active");

    load();
}


/* =========================================================
   MASTER CALCULATION
========================================================= */

function calculateMasters(){

    const old15 =
    Number(
        document.getElementById(
            "master15Old"
        ).value
    ) || 0;


    const change15 =
    Number(
        document.getElementById(
            "master15Change"
        ).value
    ) || 0;


    document.getElementById(
        "master15New"
    ).value =
    (
        old15 + change15
    ).toFixed(2);


    const old1 =
    Number(
        document.getElementById(
            "master1Old"
        ).value
    ) || 0;


    const change1 =
    Number(
        document.getElementById(
            "master1Change"
        ).value
    ) || 0;


    document.getElementById(
        "master1New"
    ).value =
    (
        old1 + change1
    ).toFixed(2);
}


/* =========================================================
   CALCULATE ALL ROWS
========================================================= */

function calculateRows(){

    calculateMasters();

    const data = getProduct();


    data.rates.forEach(
        (row,index)=>{

            const old =
            Number(
                document.getElementById(
                    "old-"+index
                ).value
            ) || 0;


            const master =
            document.getElementById(
                "master-"+index
            ).value;


            const link =
            Number(
                document.getElementById(
                    "link-"+index
                ).value
            ) || 0;


            const round =
            Number(
                document.getElementById(
                    "round-"+index
                ).value
            ) || 0;


            let change = 0;


            if(master === "15KG"){

                change =
                Number(
                    document.getElementById(
                        "master15Change"
                    ).value
                ) || 0;

            }


            if(master === "1LTR"){

                change =
                Number(
                    document.getElementById(
                        "master1Change"
                    ).value
                ) || 0;

            }


            let newRate = old;


            if(master !== "MANUAL"){

                newRate =
                old +
                (change * link);

                newRate =
                roundRate(
                    newRate,
                    round
                );

            }


            document.getElementById(
                "new-"+index
            ).value =
            newRate.toFixed(2);

        }
    );
}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(){

    const data =
    getProduct();


    const tbody =
    document.getElementById(
        "rateRows"
    );


    tbody.innerHTML = "";


    data.rates.forEach(
        (row,index)=>{

            const name = row[0];
            const old = row[1];


            const saved =
            row[2] || {};


            const master =
            saved.master ||
            getDefaultMaster(name);


            const link =
            saved.link !== undefined
            ?
            saved.link
            :
            getDefaultLink(name);


            const round =
            saved.round !== undefined
            ?
            saved.round
            :
            getDefaultRound(name);


            const tr =
            document.createElement("tr");


            tr.innerHTML = `

<td>
${name}
</td>


<td>

<input
type="number"
step="0.01"
id="old-${index}"
value="${old}"
${isLocked ? "disabled" : ""}
>

</td>


<td>

<select
id="master-${index}"
${isLocked ? "disabled" : ""}
>

<option
value="15KG"
${master === "15KG" ? "selected" : ""}
>
15 KG MASTER
</option>

<option
value="1LTR"
${master === "1LTR" ? "selected" : ""}
>
1 LTR MASTER
</option>

<option
value="MANUAL"
${master === "MANUAL" ? "selected" : ""}
>
MANUAL
</option>

</select>

</td>


<td>

<input
class="rate-link"
type="number"
step="0.01"
id="link-${index}"
value="${link}"
${isLocked ? "disabled" : ""}
>

</td>


<td>

<input
class="round"
type="number"
step="0.01"
id="round-${index}"
value="${round}"
${isLocked ? "disabled" : ""}
>

</td>


<td>

<input
class="rate-new"
type="number"
step="0.01"
id="new-${index}"
value="${old}"
disabled
>

</td>

`;


            tbody.appendChild(tr);


            [
                "old-",
                "master-",
                "link-",
                "round-"
            ].forEach(prefix=>{

                const el =
                document.getElementById(
                    prefix+index
                );

                el.addEventListener(
                    "input",
                    calculateRows
                );

                el.addEventListener(
                    "change",
                    calculateRows
                );

            });

        }
    );


    document.getElementById(
        "productTitle"
    ).innerText =
    data.name +
    " — " +
    city.toUpperCase() +
    " — PACKING RATE FORMULA";


    calculateRows();
}


/* =========================================================
   LOAD
========================================================= */

function load(){

    const data =
    getProduct();


    /* FIND 15 KG MASTER */

    let master15 =
    data.rates.find(row=>{

        const n =
        row[0].toLowerCase();

        return(
            n.includes("15 kg") ||
            n.includes("15kg") ||
            n.includes("15 ltr")
        );

    });


    /* FIND 1 LTR MASTER */

    let master1 =
    data.rates.find(row=>{

        const n =
        row[0].toLowerCase();

        return(
            n.includes("1 ltr")
        );

    });


    document.getElementById(
        "master15Old"
    ).value =
    master15
    ?
    master15[1]
    :
    0;


    document.getElementById(
        "master1Old"
    ).value =
    master1
    ?
    master1[1]
    :
    0;


    document.getElementById(
        "master15Change"
    ).value =
    data.master15Change || 0;


    document.getElementById(
        "master1Change"
    ).value =
    data.master1Change || 0;


    document.getElementById(
        "master15Change"
    ).disabled =
    isLocked;


    document.getElementById(
        "master1Change"
    ).disabled =
    isLocked;


    renderTable();

    renderHistory();
}


/* =========================================================
   LOCK / UNLOCK
========================================================= */

function toggleLock(){

    isLocked = !isLocked;


    const button =
    document.getElementById(
        "lockButton"
    );


    const save =
    document.getElementById(
        "saveButton"
    );


    if(isLocked){

        button.innerHTML =
        "🔒 LOCKED";

        button.className =
        "lock-btn locked";

        save.disabled = true;

    }
    else{

        button.innerHTML =
        "🔓 UNLOCKED";

        button.className =
        "lock-btn unlocked";

        save.disabled = false;

    }


    document.getElementById(
        "master15Change"
    ).disabled =
    isLocked;


    document.getElementById(
        "master1Change"
    ).disabled =
    isLocked;


    renderTable();

    calculateRows();
}


/* =========================================================
   SAVE
========================================================= */

function saveRates(){

    if(isLocked){

        alert(
            "🔒 Panel LOCKED hai. Pehle UNLOCK kare."
        );

        return;
    }


    const data =
    getProduct();


    const master15Change =
    Number(
        document.getElementById(
            "master15Change"
        ).value
    ) || 0;


    const master1Change =
    Number(
        document.getElementById(
            "master1Change"
        ).value
    ) || 0;


    let changesMade = 0;


    /* SAVE EACH ROW */

    data.rates.forEach(
        (row,index)=>{

            const oldRate =
            Number(
                document.getElementById(
                    "old-"+index
                ).value
            ) || 0;


            const newRate =
            Number(
                document.getElementById(
                    "new-"+index
                ).value
            ) || 0;


            const master =
            document.getElementById(
                "master-"+index
            ).value;


            const link =
            Number(
                document.getElementById(
                    "link-"+index
                ).value
            ) || 0;


            const round =
            Number(
                document.getElementById(
                    "round-"+index
                ).value
            ) || 0;


            /* HISTORY */

            if(
                Number(oldRate) !==
                Number(newRate)
            ){

                changesMade++;


                history.push({

                    timestamp:
                    new Date().toISOString(),

                    city:city,

                    product:
                    PRODUCTS[product].name,

                    packing:
                    row[0],

                    oldRate:
                    oldRate,

                    newRate:
                    newRate

                });

            }


            /* SAVE */

            data.rates[index] = [

                row[0],

                newRate,

                {

                    master:master,

                    link:link,

                    round:round

                }

            ];

        }
    );


    /* MASTER CHANGE SAVE */

    data.master15Change =
    master15Change;


    data.master1Change =
    master1Change;


    /* SAVE DATABASE */

    localStorage.setItem(
        "VISHWAS_RATE_DATABASE_V4",
        JSON.stringify(db)
    );


    /* SAVE HISTORY */

    cleanHistory();


    localStorage.setItem(
        "VISHWAS_RATE_HISTORY_V4",
        JSON.stringify(history)
    );


    /* RESET CHANGE TO ZERO */

    data.master15Change = 0;
    data.master1Change = 0;


    document.getElementById(
        "master15Change"
    ).value = 0;


    document.getElementById(
        "master1Change"
    ).value = 0;


    /* SAVE RESET VALUES */

    localStorage.setItem(
        "VISHWAS_RATE_DATABASE_V4",
        JSON.stringify(db)
    );


    /* RELOAD */

    load();


    showMessage(
        changesMade > 0
        ?
        "✅ RATE UPDATED SUCCESSFULLY"
        :
        "ℹ️ KOI RATE CHANGE NAHI HUA"
    );

}


/* =========================================================
   CLEAN HISTORY - ONLY LAST 3 DAYS
========================================================= */

function cleanHistory(){

    const now =
    Date.now();


    const threeDays =
    3 * 24 * 60 * 60 * 1000;


    history =
    history.filter(item=>{

        const time =
        new Date(
            item.timestamp
        ).getTime();


        return(
            now - time
        ) <= threeDays;

    });


    history.sort(
        (a,b)=>
        new Date(b.timestamp) -
        new Date(a.timestamp)
    );

}


/* =========================================================
   HISTORY DISPLAY
========================================================= */

function renderHistory(){

    cleanHistory();


    const list =
    document.getElementById(
        "historyList"
    );


    if(!history.length){

        list.innerHTML = `

        <div class="empty-history">
        Last 3 days me koi rate change nahi hua.
        </div>

        `;

        return;
    }


    list.innerHTML = "";


    history.forEach(item=>{

        const date =
        new Date(
            item.timestamp
        );


        const div =
        document.createElement(
            "div"
        );


        div.className =
        "history-item";


        div.innerHTML = `

        <div class="history-product">

        ${item.product}
        —
        ${item.packing}

        </div>


        <div>

        ${item.city.toUpperCase()}

        &nbsp; | &nbsp;

        <span class="old-history">
        ₹${Number(item.oldRate).toFixed(2)}
        </span>

        →

        <span class="new-history">
        ₹${Number(item.newRate).toFixed(2)}
        </span>

        </div>


        <div class="history-date">

        ${date.toLocaleString()}

        </div>

        `;


        list.appendChild(div);

    });

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text){

    const box =
    document.getElementById(
        "message"
    );


    box.innerText =
    text;


    box.style.display =
    "block";


    setTimeout(()=>{

        box.style.display =
        "none";

    },3500);

}


/* =========================================================
   START
========================================================= */

load();

</script>
