<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishwas Rate - Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#222;
}

.header{
    background:#8f0000;
    color:#fff;
    padding:15px 20px;
}

.header-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-title{
    font-size:22px;
    font-weight:800;
}

.admin-title{
    font-size:13px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:18px;
}

/* CITY */

.box{
    background:#fff;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px #0001;
}

.city-buttons,
.product-tabs,
.month-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-top:10px;
}

button{
    cursor:pointer;
}

.city-btn,
.product-btn,
.month-btn{
    border:1px solid #ccc;
    background:#fff;
    padding:9px 16px;
    border-radius:7px;
    font-weight:bold;
}

.city-btn.active{
    background:#990000;
    color:#fff;
}

.product-btn.active{
    background:#168b55;
    color:#fff;
}

.month-btn.active{
    background:#990000;
    color:#fff;
}

/* MASTER */

.master-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.master-card{
    background:#fff;
    padding:16px;
    border-radius:10px;
    box-shadow:0 2px 8px #0001;
}

.master-card h3{
    margin-top:0;
    color:#990000;
}

.master-inputs{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

input,select{
    width:100%;
    padding:9px;
    border:1px solid #ccc;
    border-radius:6px;
}

.new-rate{
    background:#e8f8ef;
    font-weight:bold;
}

/* PRODUCT */

.product-heading{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
}

.product-heading h2{
    margin:0;
}

.rate-table-wrap{
    background:#fff;
    border-radius:10px;
    overflow:auto;
    box-shadow:0 2px 8px #0001;
}

.rate-table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

.rate-table th{
    background:#222;
    color:#fff;
    padding:10px 8px;
    font-size:12px;
    text-align:left;
}

.rate-table td{
    border-bottom:1px solid #eee;
    padding:7px;
}

.rate-table tr:hover{
    background:#fafafa;
}

.rate-table input,
.rate-table select{
    padding:7px;
}

.new-box{
    background:#e9f8ef;
    font-weight:bold;
}

.small{
    font-size:11px;
    color:#777;
}

/* ACTION */

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.save{
    background:#168b55;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:7px;
    font-weight:bold;
}

.reset{
    background:#777;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:7px;
    font-weight:bold;
}

.preview{
    background:#1267a8;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:7px;
    font-weight:bold;
}

.status{
    display:none;
    margin-top:12px;
    padding:10px;
    background:#e8f8ef;
    color:#08743e;
    border-radius:7px;
    font-weight:bold;
}

@media(max-width:800px){

    .master-grid{
        grid-template-columns:1fr;
    }

    .master-inputs{
        grid-template-columns:1fr;
    }

    .container{
        padding:10px;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="header-inner">
        <div class="logo-title">VISHWAS RATE</div>
        <div class="admin-title">ADMIN PANEL</div>
    </div>
</header>

<div class="container">

<!-- CITY -->

<div class="box">

    <b>SELECT CITY / PARTY</b>

    <div class="city-buttons">

        <button class="city-btn active"
                id="city-rajkot"
                onclick="changeCity('rajkot')">
            RAJKOT
        </button>

        <button class="city-btn"
                id="city-ahmedabad"
                onclick="changeCity('ahmedabad')">
            AHMEDABAD
        </button>

        <button class="city-btn"
                id="city-udaan"
                onclick="changeCity('udaan')">
            UDAAN
        </button>

    </div>

</div>


<!-- MONTH -->

<div class="box">

    <b>MONTH</b>

    <div class="month-buttons">

        <button class="month-btn active"
                id="month-current"
                onclick="changeMonth('CURRENT')">
            CURRENT MONTH
        </button>

        <button class="month-btn"
                id="month-next"
                onclick="changeMonth('NEXT')">
            NEXT MONTH
        </button>

    </div>

</div>


<!-- PRODUCT -->

<div class="box">

    <b>PRODUCT</b>

    <div class="product-tabs">

        <button class="product-btn active"
                data-product="palm"
                onclick="selectProduct('palm')">
            PALM
        </button>

        <button class="product-btn"
                data-product="visvita"
                onclick="selectProduct('visvita')">
            VISVITA
        </button>

        <button class="product-btn"
                data-product="soya"
                onclick="selectProduct('soya')">
            SOYA
        </button>

        <button class="product-btn"
                data-product="sunflower"
                onclick="selectProduct('sunflower')">
            SUNFLOWER
        </button>

        <button class="product-btn"
                data-product="groundnut"
                onclick="selectProduct('groundnut')">
            GROUNDNUT
        </button>

        <button class="product-btn"
                data-product="cotton"
                onclick="selectProduct('cotton')">
            COTTONSEED
        </button>

        <button class="product-btn"
                data-product="mustard"
                onclick="selectProduct('mustard')">
            MUSTARD
        </button>

    </div>

</div>


<!-- MASTER -->

<div class="master-grid">

    <div class="master-card">

        <h3>15 KG / BIG PACK MASTER</h3>

        <div class="master-inputs">

            <div>
                <label>OLD RATE</label>
                <input type="number"
                       step="0.01"
                       id="master15Old"
                       oninput="calculateAll()">
            </div>

            <div>
                <label>CHANGE (+ / -)</label>
                <input type="number"
                       step="0.01"
                       id="master15Change"
                       value="0"
                       oninput="calculateAll()">
            </div>

            <div>
                <label>NEW RATE</label>
                <input type="number"
                       step="0.01"
                       id="master15New"
                       class="new-rate"
                       readonly>
            </div>

        </div>

    </div>


    <div class="master-card">

        <h3>1 LTR / SMALL PACK MASTER</h3>

        <div class="master-inputs">

            <div>
                <label>OLD RATE</label>
                <input type="number"
                       step="0.01"
                       id="master1Old"
                       oninput="calculateAll()">
            </div>

            <div>
                <label>CHANGE (+ / -)</label>
                <input type="number"
                       step="0.01"
                       id="master1Change"
                       value="0"
                       oninput="calculateAll()">
            </div>

            <div>
                <label>NEW RATE</label>
                <input type="number"
                       step="0.01"
                       id="master1New"
                       class="new-rate"
                       readonly>
            </div>

        </div>

    </div>

</div>


<br>


<!-- PRODUCT RATE TABLE -->

<div class="product-heading">

    <h2 id="productTitle">
        PALM
    </h2>

    <span class="small" id="packingCount"></span>

</div>


<div class="rate-table-wrap">

<table class="rate-table">

<thead>

<tr>

<th style="width:190px">
PACKING
</th>

<th>
OLD RATE
</th>

<th>
MASTER
</th>

<th>
CHANGE MULTIPLIER
</th>

<th>
ROUND OFF
</th>

<th>
NEW RATE
</th>

</tr>

</thead>

<tbody id="rateRows"></tbody>

</table>

</div>


<!-- ACTIONS -->

<div class="actions">

<button class="save"
        onclick="saveRates()">
    SAVE RATES
</button>

<button class="preview"
        onclick="openCustomer()">
    OPEN CUSTOMER PAGE
</button>

<button class="reset"
        onclick="resetProduct()">
    RESET PRODUCT
</button>

</div>


<div class="status" id="status"></div>

</div>


<script>

/* =====================================================
   ACTUAL PRODUCT STRUCTURE
===================================================== */

const products = {

    palm:{
        name:"PALM",
        rates:[
            ["15 KG N TIN",2384],
            ["15 KG S TIN",2339],
            ["15 LTR N TIN",2174],
            ["15 LTR S TIN",2129],
            ["5 LTR JAR",731],
            ["4.150 KG JAR",701],
            ["2 LTR JAR",299.46],
            ["1.6 KG JAR",274.46],
            ["1 LTR BOTTLE",146.20],
            ["1 LTR POUCH",141.20],
            ["790 GM BOTTLE",136.20],
            ["750 GM POUCH",124.70],
            ["500 ML BOTTLE",74.60],
            ["500 ML POUCH",72.10],
            ["395 GM BOTTLE",69.60]
        ]
    },

    visvita:{
        name:"VISVITA",
        rates:[
            ["15 KG OLD TIN",0],
            ["15 KG NEW TIN",0]
        ]
    },

    soya:{
        name:"SOYA",
        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    },

    sunflower:{
        name:"SUNFLOWER",
        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    },

    groundnut:{
        name:"GROUNDNUT",
        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    },

    cotton:{
        name:"COTTONSEED",
        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    },

    mustard:{
        name:"MUSTARD",
        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    }

};


/* =====================================================
   STATE
===================================================== */

let city="rajkot";
let product="palm";
let month="CURRENT";


/* =====================================================
   DATABASE
===================================================== */

let database=
JSON.parse(
    localStorage.getItem(
        "vishwasRateDatabase"
    )
) || {};


/* =====================================================
   ENSURE DATABASE
===================================================== */

function ensureProduct(){

    if(!database[city]){
        database[city]={};
    }

    if(!database[city][product]){
        database[city][product]=
        JSON.parse(
            JSON.stringify(
                products[product]
            )
        );
    }

}


/* =====================================================
   CITY
===================================================== */

function changeCity(newCity){

    city=newCity;

    document
    .querySelectorAll(".city-btn")
    .forEach(
        b=>b.classList.remove("active")
    );

    document
    .getElementById(
        "city-"+city
    )
    .classList.add("active");

    loadProduct();
}


/* =====================================================
   MONTH
===================================================== */

function changeMonth(newMonth){

    month=newMonth;

    document
    .querySelectorAll(".month-btn")
    .forEach(
        b=>b.classList.remove("active")
    );

    document
    .getElementById(
        "month-"+month.toLowerCase()
    )
    .classList.add("active");

    loadProduct();
}


/* =====================================================
   PRODUCT
===================================================== */

function selectProduct(newProduct){

    product=newProduct;

    document
    .querySelectorAll(".product-btn")
    .forEach(
        b=>b.classList.remove("active")
    );

    document
    .querySelector(
        '[data-product="'+product+'"]'
    )
    .classList.add("active");

    loadProduct();
}


/* =====================================================
   MASTER CALCULATION
===================================================== */

function calculateMasters(){

    const old15=
        Number(
            document.getElementById(
                "master15Old"
            ).value
        ) || 0;

    const change15=
        Number(
            document.getElementById(
                "master15Change"
            ).value
        ) || 0;

    document.getElementById(
        "master15New"
    ).value=
        (old15+change15).toFixed(2);


    const old1=
        Number(
            document.getElementById(
                "master1Old"
            ).value
        ) || 0;

    const change1=
        Number(
            document.getElementById(
                "master1Change"
            ).value
        ) || 0;

    document.getElementById(
        "master1New"
    ).value=
        (old1+change1).toFixed(2);

}


/* =====================================================
   ROUND
===================================================== */

function roundValue(value,round){

    if(!round || round<=0){
        return Number(value.toFixed(2));
    }

    return Number(
        (
            Math.round(
                value/round
            )*round
        ).toFixed(2)
    );

}


/* =====================================================
   DETECT MASTER
===================================================== */

function detectMaster(name){

    const n=name.toLowerCase();

    if(
        n.includes("15 kg") ||
        n.includes("15kg") ||
        n.includes("15 ltr")
    ){
        return "15KG";
    }

    return "1LTR";
}


/* =====================================================
   DEFAULT MULTIPLIER
===================================================== */

function defaultMultiplier(
    name,
    master
){

    const n=name.toLowerCase();

    if(master==="15KG"){

        if(
            n.includes("15 kg") ||
            n.includes("15kg") ||
            n.includes("15 ltr")
        ){
            return 1;
        }

        if(n.includes("5 ltr"))
            return 5/15;

        if(n.includes("4.150"))
            return 4.150/15;

        if(n.includes("2 ltr"))
            return 2/15;

        if(n.includes("1.6"))
            return 1.6/15;

    }


    if(n.includes("1 ltr"))
        return 1;

    if(n.includes("790"))
        return .790;

    if(n.includes("750"))
        return .750;

    if(n.includes("500"))
        return .500;

    if(n.includes("395"))
        return .395;

    if(n.includes("5 ltr"))
        return 5;

    if(n.includes("4.150"))
        return 4.150;

    if(n.includes("2 ltr"))
        return 2;

    if(n.includes("1.6"))
        return 1.6;

    return 1;

}


/* =====================================================
   DEFAULT ROUND
===================================================== */

function defaultRound(master){

    if(master==="15KG"){
        return 1;
    }

    return .10;

}


/* =====================================================
   RENDER
===================================================== */

function renderRows(){

    ensureProduct();

    const data=
        database[city][product];

    const rows=
        data.rates || [];

    const tbody=
        document.getElementById(
            "rateRows"
        );

    tbody.innerHTML="";


    rows.forEach(
        (row,index)=>{

            const name=row[0];

            const oldRate=
                Number(row[1]) || 0;

            const saved=
                row[2] || {};

            const master=
                saved.master ||
                detectMaster(name);

            const multiplier=
                saved.multiplier !== undefined
                ?
                saved.multiplier
                :
                defaultMultiplier(
                    name,
                    master
                );

            const round=
                saved.round !== undefined
                ?
                saved.round
                :
                defaultRound(master);


            const tr=
                document.createElement("tr");


            tr.innerHTML=`

<td>
    <b>${name}</b>
</td>

<td>

<input
    type="number"
    step="0.01"
    id="old-${index}"
    value="${oldRate}"
>

</td>

<td>

<select id="master-${index}">

<option value="15KG"
${master==="15KG"?"selected":""}>
15 KG MASTER
</option>

<option value="1LTR"
${master==="1LTR"?"selected":""}>
1 LTR MASTER
</option>

<option value="MANUAL"
${master==="MANUAL"?"selected":""}>
MANUAL
</option>

</select>

</td>

<td>

<input
    type="number"
    step="0.001"
    id="multi-${index}"
    value="${multiplier}"
>

</td>

<td>

<input
    type="number"
    step="0.01"
    id="round-${index}"
    value="${round}"
>

</td>

<td>

<input
    class="new-box"
    type="number"
    step="0.01"
    id="new-${index}"
    value="${oldRate}"
>

</td>

`;


            tbody.appendChild(tr);


            [
                "old-",
                "master-",
                "multi-",
                "round-"
            ].forEach(
                prefix=>{

                    document
                    .getElementById(
                        prefix+index
                    )
                    .addEventListener(
                        "input",
                        calculateAll
                    );

                    document
                    .getElementById(
                        prefix+index
                    )
                    .addEventListener(
                        "change",
                        calculateAll
                    );

                }
            );

        }
    );


    document.getElementById(
        "productTitle"
    ).innerText=
        products[product].name;


    document.getElementById(
        "packingCount"
    ).innerText=
        rows.length+
        " PACKING";


    calculateAll();

}


/* =====================================================
   CALCULATE ALL
===================================================== */

function calculateAll(){

    calculateMasters();

    ensureProduct();

    const rows=
        database[city][product].rates;


    rows.forEach(
        (row,index)=>{

            const old=
                Number(
                    document.getElementById(
                        "old-"+index
                    ).value
                ) || 0;

            const master=
                document.getElementById(
                    "master-"+index
                ).value;

            const multiplier=
                Number(
                    document.getElementById(
                        "multi-"+index
                    ).value
                ) || 0;

            const round=
                Number(
                    document.getElementById(
                        "round-"+index
                    ).value
                ) || 0;


            let change=0;


            if(master==="15KG"){

                change=
                    Number(
                        document.getElementById(
                            "master15Change"
                        ).value
                    ) || 0;

            }


            if(master==="1LTR"){

                change=
                    Number(
                        document.getElementById(
                            "master1Change"
                        ).value
                    ) || 0;

            }


            let result=old;


            if(master!=="MANUAL"){

                result=
                    old+
                    (
                        change*
                        multiplier
                    );

                result=
                    roundValue(
                        result,
                        round
                    );

            }


            document.getElementById(
                "new-"+index
            ).value=
                result.toFixed(2);

        }
    );

}


/* =====================================================
   SAVE
===================================================== */

function saveRates(){

    ensureProduct();

    const rows=
        database[city][product].rates;


    rows.forEach(
        (row,index)=>{

            const old=
                Number(
                    document.getElementById(
                        "old-"+index
                    ).value
                ) || 0;

            const newRate=
                Number(
                    document.getElementById(
                        "new-"+index
                    ).value
                ) || 0;

            const master=
                document.getElementById(
                    "master-"+index
                ).value;

            const multiplier=
                Number(
                    document.getElementById(
                        "multi-"+index
                    ).value
                ) || 0;

            const round=
                Number(
                    document.getElementById(
                        "round-"+index
                    ).value
                ) || 0;


            rows[index]=[

                row[0],

                newRate,

                {
                    oldRate:old,
                    master:master,
                    multiplier:multiplier,
                    round:round
                }

            ];

        }
    );


    database[city][product].master={

        "15KG":{

            old:Number(
                document.getElementById(
                    "master15Old"
                ).value
            ) || 0,

            change:Number(
                document.getElementById(
                    "master15Change"
                ).value
            ) || 0,

            newRate:Number(
                document.getElementById(
                    "master15New"
                ).value
            ) || 0

        },

        "1LTR":{

            old:Number(
                document.getElementById(
                    "master1Old"
                ).value
            ) || 0,

            change:Number(
                document.getElementById(
                    "master1Change"
                ).value
            ) || 0,

            newRate:Number(
                document.getElementById(
                    "master1New"
                ).value
            ) || 0

        }

    };


    database[city][product].month=
        month;


    localStorage.setItem(
        "vishwasRateDatabase",
        JSON.stringify(
            database
        )
    );


    showStatus(
        "RATE SAVED SUCCESSFULLY"
    );

}


/* =====================================================
   LOAD
===================================================== */

function loadProduct(){

    ensureProduct();

    const data=
        database[city][product];


    const master15=
        data.master &&
        data.master["15KG"];


    const master1=
        data.master &&
        data.master["1LTR"];


    document.getElementById(
        "master15Old"
    ).value=
        master15
        ?
        master15.old
        :
        findRate("15 KG");


    document.getElementById(
        "master15Change"
    ).value=
        master15
        ?
        master15.change
        :
        0;


    document.getElementById(
        "master1Old"
    ).value=
        master1
        ?
        master1.old
        :
        findRate("1 LTR");


    document.getElementById(
        "master1Change"
    ).value=
        master1
        ?
        master1.change
        :
        0;


    renderRows();

}


/* =====================================================
   FIND RATE
===================================================== */

function findRate(search){

    const rows=
        database[city][product].rates || [];

    const found=
        rows.find(
            r=>
            r[0]
            .toLowerCase()
            .includes(
                search.toLowerCase()
            )
        );

    return found
        ?
        Number(found[1]) || 0
        :
        0;

}


/* =====================================================
   RESET
===================================================== */

function resetProduct(){

    if(
        !confirm(
            "Is product ko default rate par reset karna hai?"
        )
    ){
        return;
    }


    database[city][product]=
        JSON.parse(
            JSON.stringify(
                products[product]
            )
        );


    localStorage.setItem(
        "vishwasRateDatabase",
        JSON.stringify(database)
    );


    loadProduct();

    showStatus(
        "PRODUCT RESET HO GAYA"
    );

}


/* =====================================================
   CUSTOMER
===================================================== */

function openCustomer(){

    window.open(
        "index.html",
        "_blank"
    );

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(message){

    const box=
        document.getElementById(
            "status"
        );

    box.innerText=message;

    box.style.display="block";

    setTimeout(
        ()=>{
            box.style.display="none";
        },
        2500
    );

}


/* =====================================================
   START
===================================================== */

loadProduct();

</script>

</body>
</html>
