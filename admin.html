<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Vishwas Rate - Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#222;
}

.header{
    background:#8f0000;
    color:white;
    padding:16px 20px;
}

.header-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo-title{
    font-size:22px;
    font-weight:800;
}

.admin-title{
    font-size:13px;
    opacity:.9;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:18px;
}

/* CITY */

.city-bar{
    background:white;
    padding:15px;
    border-radius:10px;
    box-shadow:0 2px 8px #0001;
    margin-bottom:15px;
}

.city-buttons{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.city-btn{
    border:1px solid #ccc;
    background:white;
    padding:10px 22px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.city-btn.active{
    background:#990000;
    color:white;
    border-color:#990000;
}

/* MONTH */

.month-bar{
    background:#fff8df;
    border:1px solid #e2c96b;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
}

.month-buttons{
    display:flex;
    gap:8px;
    margin-top:8px;
}

.month-btn{
    padding:8px 18px;
    border:1px solid #c8ad4c;
    background:white;
    border-radius:6px;
    cursor:pointer;
}

.month-btn.active{
    background:#990000;
    color:white;
}

/* PRODUCT */

.product-tabs{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.product-btn{
    padding:9px 15px;
    border:1px solid #ccc;
    background:white;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.product-btn.active{
    background:#168b55;
    color:white;
    border-color:#168b55;
}

/* MASTER */

.master-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:18px;
}

.master{
    background:white;
    border-radius:10px;
    padding:16px;
    box-shadow:0 2px 8px #0001;
}

.master h3{
    margin-top:0;
    color:#990000;
}

.master-grid-inner{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

label{
    font-size:12px;
    font-weight:bold;
    display:block;
    margin-bottom:5px;
}

input,select{
    width:100%;
    padding:9px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

.new-rate{
    background:#e9f8ef;
    font-weight:bold;
}

/* FORMULA */

.formula-box{
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px #0001;
    overflow:hidden;
}

.formula-header{
    background:#222;
    color:white;
    padding:13px;
    font-weight:bold;
}

.formula-row{
    display:grid;
    grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;
    gap:8px;
    padding:9px 12px;
    border-bottom:1px solid #eee;
    align-items:center;
}

.formula-row.header-row{
    background:#f0f0f0;
    font-weight:bold;
    font-size:12px;
}

.rate-input{
    text-align:right;
}

.result-input{
    background:#f1fff5;
    font-weight:bold;
}

/* BUTTONS */

.actions{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

.save{
    background:#168b55;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.reset{
    background:#777;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.preview{
    background:#1267a8;
    color:white;
    border:0;
    padding:12px 25px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.status{
    margin-top:12px;
    padding:10px;
    border-radius:7px;
    display:none;
    background:#e9f8ef;
    color:#08743e;
    font-weight:bold;
}

@media(max-width:900px){

    .master-grid{
        grid-template-columns:1fr;
    }

    .formula-row{
        grid-template-columns:1.3fr 1fr 1fr 1fr 1fr;
        font-size:12px;
    }

}

@media(max-width:600px){

    .container{
        padding:10px;
    }

    .master-grid-inner{
        grid-template-columns:1fr;
    }

    .formula-box{
        overflow-x:auto;
    }

    .formula-row{
        min-width:700px;
    }

}

</style>
</head>


<body>


<header class="header">

    <div class="header-inner">

        <div class="logo-title">
            VISHWAS RATE
        </div>

        <div class="admin-title">
            ADMIN PANEL
        </div>

    </div>

</header>


<div class="container">


<!-- CITY -->

<div class="city-bar">

    <b>SELECT CITY / PARTY</b>

    <br><br>

    <div class="city-buttons">

        <button
            class="city-btn active"
            onclick="changeCity('rajkot')"
            id="city-rajkot">
            RAJKOT
        </button>

        <button
            class="city-btn"
            onclick="changeCity('ahmedabad')"
            id="city-ahmedabad">
            AHMEDABAD
        </button>

        <button
            class="city-btn"
            onclick="changeCity('udaan')"
            id="city-udaan">
            UDAAN
        </button>

    </div>

</div>


<!-- MONTH -->

<div class="month-bar">

    <b>MONTH</b>

    <div class="month-buttons">

        <button
            class="month-btn active"
            id="month-current"
            onclick="changeMonth('CURRENT')">
            CURRENT MONTH
        </button>

        <button
            class="month-btn"
            id="month-next"
            onclick="changeMonth('NEXT')">
            NEXT MONTH
        </button>

    </div>

</div>


<!-- PRODUCTS -->

<div class="product-tabs">

    <button
        class="product-btn active"
        onclick="selectProduct('palm')">
        PALM
    </button>

    <button
        class="product-btn"
        onclick="selectProduct('visvita')">
        VISVITA
    </button>

    <button
        class="product-btn"
        onclick="selectProduct('soya')">
        SOYA
    </button>

    <button
        class="product-btn"
        onclick="selectProduct('sunflower')">
        SUNFLOWER
    </button>

    <button
        class="product-btn"
        onclick="selectProduct('groundnut')">
        GROUNDNUT
    </button>

    <button
        class="product-btn"
        onclick="selectProduct('cotton')">
        COTTONSEED
    </button>

    <button
        class="product-btn"
        onclick="selectProduct('mustard')">
        MUSTARD
    </button>

</div>


<!-- MASTER -->

<div class="master-grid">


    <!-- 15 KG -->

    <div class="master">

        <h3>15 KG / BIG PACKING MASTER</h3>

        <div class="master-grid-inner">

            <div>

                <label>
                    OLD RATE
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="master15Old"
                    oninput="calculateMaster15()"
                >

            </div>


            <div>

                <label>
                    CHANGE (+ / -)
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="master15Change"
                    value="0"
                    oninput="calculateMaster15()"
                >

            </div>


            <div>

                <label>
                    NEW RATE
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="master15New"
                    class="new-rate"
                    readonly
                >

            </div>

        </div>

    </div>


    <!-- 1 LTR -->

    <div class="master">

        <h3>1 LTR / SMALL PACKING MASTER</h3>

        <div class="master-grid-inner">

            <div>

                <label>
                    OLD RATE
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="master1Old"
                    oninput="calculateMaster1()"
                >

            </div>


            <div>

                <label>
                    CHANGE (+ / -)
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="master1Change"
                    value="0"
                    oninput="calculateMaster1()"
                >

            </div>


            <div>

                <label>
                    NEW RATE
                </label>

                <input
                    type="number"
                    step="0.01"
                    id="master1New"
                    class="new-rate"
                    readonly
                >

            </div>

        </div>

    </div>

</div>


<!-- FORMULA TABLE -->

<div class="formula-box">

    <div class="formula-header">

        PACKING-WISE FORMULA / ROUND OFF

    </div>


    <div class="formula-row header-row">

        <div>
            PACKING
        </div>

        <div>
            OLD RATE
        </div>

        <div>
            MASTER
        </div>

        <div>
            MULTIPLIER
        </div>

        <div>
            NEW RATE
        </div>

    </div>


    <div id="formulaRows"></div>

</div>


<div class="actions">

    <button
        class="save"
        onclick="saveRates()">
        SAVE RATES
    </button>

    <button
        class="preview"
        onclick="openCustomer()">
        OPEN CUSTOMER PAGE
    </button>

    <button
        class="reset"
        onclick="resetProduct()">
        RESET PRODUCT
    </button>

</div>


<div
    class="status"
    id="status">
</div>


</div>


<script>


/* =====================================================
   DEFAULT PRODUCTS
===================================================== */

const products = {

    palm:{
        name:"Palmolein",

        rates:[
            ["15 KG N TIN",2384],
            ["15 KG S TIN",2339],
            ["15 LTR N TIN",2174],
            ["15 LTR S TIN",2129],
            ["5 LTR JAR",731],
            ["4.150 KG JAR",701],
            ["2 LTR JAR",299.46],
            ["1.6 KG JAR",274.46],
            ["1 LTR BOTTLE",146.20],
            ["1 LTR POUCH",141.20],
            ["790 GM BOTTLE",136.20],
            ["750 GM POUCH",124.70],
            ["500 ML BOTTLE",74.60],
            ["500 ML POUCH",72.10],
            ["395 GM BOTTLE",69.60]
        ]
    },


    visvita:{
        name:"Visvita",

        rates:[
            ["15 KG OLD TIN",0],
            ["15 KG NEW TIN",0]
        ]
    },


    soya:{
        name:"Soya",

        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    },


    sunflower:{
        name:"Sunflower",

        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    },


    groundnut:{
        name:"Groundnut",

        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    },


    cotton:{
        name:"Cottonseed",

        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    },


    mustard:{
        name:"Mustard",

        rates:[
            ["15 KG",0],
            ["1 LTR",0]
        ]
    }

};


/* =====================================================
   STATE
===================================================== */

let city = "rajkot";

let product = "palm";

let month = "CURRENT";


/* =====================================================
   LOAD DATABASE
===================================================== */

let database =
    JSON.parse(
        localStorage.getItem(
            "vishwasRateDatabase"
        )
    );


if(!database){

    database = {

        rajkot:{},
        ahmedabad:{},
        udaan:{}

    };

}


/* =====================================================
   MAKE CITY PRODUCT
===================================================== */

function ensureProduct(){

    if(
        !database[city]
    ){

        database[city] = {};

    }


    if(
        !database[city][product]
    ){

        database[city][product] =
            JSON.parse(
                JSON.stringify(
                    products[product]
                )
            );

    }

}


/* =====================================================
   CITY
===================================================== */

function changeCity(
    newCity
){

    city = newCity;

    document
        .querySelectorAll(".city-btn")
        .forEach(
            x => x.classList.remove("active")
        );

    document
        .getElementById(
            "city-" + city
        )
        .classList.add("active");

    loadProduct();

}


/* =====================================================
   MONTH
===================================================== */

function changeMonth(
    newMonth
){

    month = newMonth;

    document
        .querySelectorAll(".month-btn")
        .forEach(
            x => x.classList.remove("active")
        );

    document
        .getElementById(
            "month-" +
            month.toLowerCase()
        )
        .classList.add("active");

    loadProduct();

}


/* =====================================================
   PRODUCT
===================================================== */

function selectProduct(
    newProduct
){

    product = newProduct;

    document
        .querySelectorAll(".product-btn")
        .forEach(
            x => x.classList.remove("active")
        );

    event.target.classList.add("active");

    loadProduct();

}


/* =====================================================
   MASTER CALCULATION
===================================================== */

function calculateMaster15(){

    const old =
        Number(
            document.getElementById(
                "master15Old"
            ).value
        ) || 0;

    const change =
        Number(
            document.getElementById(
                "master15Change"
            ).value
        ) || 0;

    document.getElementById(
        "master15New"
    ).value =
        (old + change).toFixed(2);

}


function calculateMaster1(){

    const old =
        Number(
            document.getElementById(
                "master1Old"
            ).value
        ) || 0;

    const change =
        Number(
            document.getElementById(
                "master1Change"
            ).value
        ) || 0;

    document.getElementById(
        "master1New"
    ).value =
        (old + change).toFixed(2);

}


/* =====================================================
   ROUND
===================================================== */

function roundRate(
    value,
    round
){

    round =
        Number(round);

    if(
        !round ||
        round <= 0
    ){

        return Number(
            value.toFixed(2)
        );

    }

    return Number(
        (
            Math.round(
                value / round
            ) * round
        ).toFixed(2)
    );

}


/* =====================================================
   RENDER FORMULA ROWS
===================================================== */

function renderRows(){

    ensureProduct();

    const data =
        database[city][product];

    const rows =
        data.rates || [];

    const container =
        document.getElementById(
            "formulaRows"
        );

    container.innerHTML = "";


    rows.forEach(
        (row,index) => {

            const name =
                row[0];

            const oldRate =
                Number(row[1]) || 0;


            /*
               Determine master automatically
            */

            let master =
                "15KG";

            const lower =
                name.toLowerCase();


            if(
                lower.includes("ltr") &&
                !lower.includes("15 ltr")
            ){

                master =
                    "1LTR";

            }


            if(
                lower.includes("ml") ||
                lower.includes("gm")
            ){

                master =
                    "1LTR";

            }


            /*
               Default multiplier
            */

            let multiplier = 1;

            if(master === "15KG"){

                if(
                    lower.includes("15 kg") ||
                    lower.includes("15kg")
                ){

                    multiplier = 1;

                }

                else if(
                    lower.includes("15 ltr")
                ){

                    multiplier = 1;

                }

                else if(
                    lower.includes("5 ltr")
                ){

                    multiplier = 5 / 15;

                }

                else if(
                    lower.includes("4.150")
                ){

                    multiplier = 4.150 / 15;

                }

                else if(
                    lower.includes("2 ltr")
                ){

                    multiplier = 2 / 15;

                }

                else if(
                    lower.includes("1.6")
                ){

                    multiplier = 1.6 / 15;

                }

            }
            else{

                if(
                    lower.includes("1 ltr")
                ){

                    multiplier = 1;

                }

                else if(
                    lower.includes("790")
                ){

                    multiplier = 0.790;

                }

                else if(
                    lower.includes("750")
                ){

                    multiplier = 0.750;

                }

                else if(
                    lower.includes("500")
                ){

                    multiplier = 0.500;

                }

                else if(
                    lower.includes("395")
                ){

                    multiplier = 0.395;

                }

                else if(
                    lower.includes("4.150")
                ){

                    multiplier = 4.150;

                }

                else if(
                    lower.includes("5 ltr")
                ){

                    multiplier = 5;

                }

                else if(
                    lower.includes("2 ltr")
                ){

                    multiplier = 2;

                }

                else if(
                    lower.includes("1.6")
                ){

                    multiplier = 1.6;

                }

            }


            /*
               Existing custom settings
            */

            let saved =
                row[2] || {};

            let savedMaster =
                saved.master ||
                master;

            let savedMultiplier =
                saved.multiplier !== undefined
                ?
                saved.multiplier
                :
                multiplier;

            let savedRound =
                saved.round !== undefined
                ?
                saved.round
                :
                (
                    savedMaster === "15KG"
                    ?
                    1
                    :
                    0.10
                );


            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "formula-row";


            div.innerHTML = `

                <div>
                    <b>${name}</b>
                </div>


                <div>

                    <input
                        class="rate-input"
                        type="number"
                        step="0.01"
                        id="old-${index}"
                        value="${oldRate}"
                    >

                </div>


                <div>

                    <select
                        id="master-${index}"
                    >

                        <option
                            value="15KG"
                            ${savedMaster==="15KG"?"selected":""}>
                            15 KG
                        </option>

                        <option
                            value="1LTR"
                            ${savedMaster==="1LTR"?"selected":""}>
                            1 LTR
                        </option>

                        <option
                            value="MANUAL"
                            ${savedMaster==="MANUAL"?"selected":""}>
                            MANUAL
                        </option>

                    </select>

                </div>


                <div>

                    <input
                        type="number"
                        step="0.001"
                        id="multi-${index}"
                        value="${savedMultiplier}"
                    >

                    <small>
                        Multiplier
                    </small>

                </div>


                <div>

                    <input
                        class="rate-input result-input"
                        type="number"
                        step="0.01"
                        id="new-${index}"
                        value="${oldRate}"
                    >

                    <input
                        type="number"
                        step="0.01"
                        id="round-${index}"
                        value="${savedRound}"
                        title="Round Off"
                    >

                    <small>
                        Round Off
                    </small>

                </div>

            `;


            container.appendChild(
                div
            );


            /*
               Auto calculation
            */

            const oldInput =
                document.getElementById(
                    "old-" + index
                );

            const masterInput =
                document.getElementById(
                    "master-" + index
                );

            const multiInput =
                document.getElementById(
                    "multi-" + index
                );

            const roundInput =
                document.getElementById(
                    "round-" + index
                );


            [
                oldInput,
                masterInput,
                multiInput,
                roundInput
            ].forEach(
                input => {

                    input.addEventListener(
                        "input",
                        () =>
                        calculateRow(
                            index
                        )
                    );

                    input.addEventListener(
                        "change",
                        () =>
                        calculateRow(
                            index
                        )
                    );

                }
            );


            calculateRow(
                index
            );

        }
    );

}


/* =====================================================
   CALCULATE ROW
===================================================== */

function calculateRow(
    index
){

    const old =
        Number(
            document.getElementById(
                "old-" + index
            ).value
        ) || 0;


    const selectedMaster =
        document.getElementById(
            "master-" + index
        ).value;


    const multiplier =
        Number(
            document.getElementById(
                "multi-" + index
            ).value
        ) || 0;


    const round =
        Number(
            document.getElementById(
                "round-" + index
            ).value
        ) || 0;


    let masterChange = 0;


    if(
        selectedMaster === "15KG"
    ){

        masterChange =
            Number(
                document.getElementById(
                    "master15Change"
                ).value
            ) || 0;

    }


    if(
        selectedMaster === "1LTR"
    ){

        masterChange =
            Number(
                document.getElementById(
                    "master1Change"
                ).value
            ) || 0;

    }


    let newRate =
        old +
        (
            masterChange *
            multiplier
        );


    /*
       MANUAL:
       no automatic master adjustment
    */

    if(
        selectedMaster === "MANUAL"
    ){

        newRate =
            old;

    }


    newRate =
        roundRate(
            newRate,
            round
        );


    document.getElementById(
        "new-" + index
    ).value =
        newRate.toFixed(2);

}


/* =====================================================
   CALCULATE ALL
===================================================== */

function calculateAll(){

    const rows =
        database[city][product].rates;


    rows.forEach(
        (_,index) => {

            calculateRow(
                index
            );

        }
    );

}


/* =====================================================
   SAVE
===================================================== */

function saveRates(){

    ensureProduct();


    const rows =
        database[city][product].rates;


    rows.forEach(
        (row,index) => {

            const old =
                Number(
                    document.getElementById(
                        "old-" + index
                    ).value
                ) || 0;


            const newRate =
                Number(
                    document.getElementById(
                        "new-" + index
                    ).value
                ) || 0;


            const master =
                document.getElementById(
                    "master-" + index
                ).value;


            const multiplier =
                Number(
                    document.getElementById(
                        "multi-" + index
                    ).value
                ) || 0;


            const round =
                Number(
                    document.getElementById(
                        "round-" + index
                    ).value
                ) || 0;


            database[city][product].rates[index] = [

                row[0],

                newRate,

                {

                    master,

                    multiplier,

                    round,

                    oldRate:old

                }

            ];

        }
    );


    /*
       Save master data
    */

    if(
        !database[city][product].master
    ){

        database[city][product].master = {};

    }


    database[city][product].master["15KG"] = {

        old:
            Number(
                document.getElementById(
                    "master15Old"
                ).value
            ) || 0,

        change:
            Number(
                document.getElementById(
                    "master15Change"
                ).value
            ) || 0,

        newRate:
            Number(
                document.getElementById(
                    "master15New"
                ).value
            ) || 0

    };


    database[city][product].master["1LTR"] = {

        old:
            Number(
                document.getElementById(
                    "master1Old"
                ).value
            ) || 0,

        change:
            Number(
                document.getElementById(
                    "master1Change"
                ).value
            ) || 0,

        newRate:
            Number(
                document.getElementById(
                    "master1New"
                ).value
            ) || 0

    };


    /*
       Save month
    */

    database[city][product].month =
        month;


    localStorage.setItem(
        "vishwasRateDatabase",
        JSON.stringify(
            database
        )
    );


    showStatus(
        "RATE SAVED SUCCESSFULLY"
    );

}


/* =====================================================
   LOAD PRODUCT
===================================================== */

function loadProduct(){

    ensureProduct();


    const data =
        database[city][product];


    /*
       Master values
    */

    let master15 =
        data.master &&
        data.master["15KG"]
        ?
        data.master["15KG"]
        :
        null;


    let master1 =
        data.master &&
        data.master["1LTR"]
        ?
        data.master["1LTR"]
        :
        null;


    document.getElementById(
        "master15Old"
    ).value =
        master15
        ?
        master15.old
        :
        findMasterRate(
            data.rates,
            "15"
        );


    document.getElementById(
        "master15Change"
    ).value =
        master15
        ?
        master15.change
        :
        0;


    document.getElementById(
        "master1Old"
    ).value =
        master1
        ?
        master1.old
        :
        findMasterRate(
            data.rates,
            "1"
        );


    document.getElementById(
        "master1Change"
    ).value =
        master1
        ?
        master1.change
        :
        0;


    calculateMaster15();

    calculateMaster1();

    renderRows();

    calculateAll();

}


/* =====================================================
   FIND MASTER
===================================================== */

function findMasterRate(
    rates,
    type
){

    if(!rates || !rates.length){

        return 0;

    }


    if(type === "15"){

        const row =
            rates.find(
                r =>
                String(
                    r[0]
                )
                .toLowerCase()
                .includes("15 kg")
            );


        return row
            ?
            Number(row[1]) || 0
            :
            0;

    }


    const row =
        rates.find(
            r =>
            String(
                r[0]
            )
            .toLowerCase()
            .includes("1 ltr")
        );


    return row
        ?
        Number(row[1]) || 0
        :
        0;

}


/* =====================================================
   RESET
===================================================== */

function resetProduct(){

    if(
        !confirm(
            "Is product ke rates default par reset karna hai?"
        )
    ){

        return;

    }


    database[city][product] =
        JSON.parse(
            JSON.stringify(
                products[product]
            )
        );


    localStorage.setItem(
        "vishwasRateDatabase",
        JSON.stringify(
            database
        )
    );


    loadProduct();

    showStatus(
        "PRODUCT RESET HO GAYA"
    );

}


/* =====================================================
   STATUS
===================================================== */

function showStatus(
    message
){

    const box =
        document.getElementById(
            "status"
        );


    box.innerText =
        message;


    box.style.display =
        "block";


    setTimeout(
        () => {

            box.style.display =
                "none";

        },
        2500
    );

}


/* =====================================================
   CUSTOMER PAGE
===================================================== */

function openCustomer(){

    window.open(
        "index.html",
        "_blank"
    );

}


/* =====================================================
   START
===================================================== */

loadProduct();

</script>
