<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vishwas Rate - Admin Panel</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#eef1f5;
    color:#222;
}

.header{
    background:#8b0000;
    color:white;
    padding:14px 20px;
}

.header-inner{
    max-width:1500px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-size:23px;
    font-weight:800;
}

.admin{
    font-size:13px;
    opacity:.9;
}

.container{
    max-width:1500px;
    margin:auto;
    padding:16px;
}

/* TOP */

.top-card{
    background:white;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px #0001;
}

.section-title{
    font-weight:bold;
    margin-bottom:10px;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
}

.btn{
    border:1px solid #ccc;
    background:white;
    padding:9px 17px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.btn:hover{
    background:#f3f3f3;
}

.city.active{
    background:#8b0000;
    color:white;
}

.month.active{
    background:#8b0000;
    color:white;
}

/* CONTROL */

.control-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:15px;
}

.lock-btn{
    border:0;
    padding:11px 22px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.locked{
    background:#333;
    color:white;
}

.unlocked{
    background:#d89b00;
    color:white;
}

.save-btn{
    background:#148650;
    color:white;
    border:0;
    padding:11px 22px;
    border-radius:7px;
    font-weight:bold;
    cursor:pointer;
}

.save-btn:disabled{
    background:#aaa;
    cursor:not-allowed;
}

/* MASTER */

.master-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
    margin-bottom:15px;
}

.master-card{
    background:white;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 8px #0001;
}

.master-title{
    font-size:17px;
    font-weight:bold;
    color:#8b0000;
    margin-bottom:12px;
}

.master-grid-inner{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:10px;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

input,select{
    width:100%;
    padding:9px;
    border:1px solid #bbb;
    border-radius:6px;
    font-size:14px;
}

input:disabled,
select:disabled{
    background:#f0f0f0;
    color:#777;
    cursor:not-allowed;
}

.new-master{
    background:#e8f8ee !important;
    font-weight:bold;
}

/* RATE TABLE */

.table-card{
    background:white;
    border-radius:10px;
    box-shadow:0 2px 8px #0001;
    overflow:hidden;
}

.table-title{
    padding:14px 15px;
    background:#222;
    color:white;
    font-weight:bold;
}

.table-wrap{
    overflow:auto;
}

table{
    width:100%;
    min-width:1050px;
    border-collapse:collapse;
}

th{
    background:#e8e8e8;
    padding:10px 8px;
    border-bottom:1px solid #ccc;
    font-size:12px;
    text-align:left;
}

td{
    padding:7px 8px;
    border-bottom:1px solid #eee;
}

tr:hover{
    background:#fafafa;
}

.rate-new{
    background:#e9f8ef;
    font-weight:bold;
}

.rate-change{
    background:#fffde2;
}

.rate-link{
    background:#dcecff;
}

.round{
    background:#f5f5f5;
}

.manual{
    background:#ffe6e6;
}

/* HISTORY */

.history-card{
    background:white;
    margin-top:15px;
    border-radius:10px;
    box-shadow:0 2px 8px #0001;
    overflow:hidden;
}

.history-title{
    padding:14px;
    background:#1267a8;
    color:white;
    font-weight:bold;
}

.history-item{
    padding:11px 14px;
    border-bottom:1px solid #eee;
}

.history-item:last-child{
    border-bottom:0;
}

.history-date{
    font-size:12px;
    color:#777;
}

.old-rate{
    color:#b00000;
    font-weight:bold;
}

.new-history{
    color:#08783e;
    font-weight:bold;
}

.empty-history{
    padding:20px;
    color:#777;
    text-align:center;
}

/* MESSAGE */

.message{
    display:none;
    position:fixed;
    right:20px;
    bottom:20px;
    background:#148650;
    color:white;
    padding:14px 20px;
    border-radius:8px;
    box-shadow:0 4px 15px #0003;
    font-weight:bold;
    z-index:1000;
}

@media(max-width:850px){

    .master-grid{
        grid-template-columns:1fr;
    }

    .master-grid-inner{
        grid-template-columns:1fr;
    }

    .container{
        padding:9px;
    }

}

</style>
</head>


<body>


<header class="header">

<div class="header-inner">

<div class="logo">
VISHWAS RATE
</div>

<div class="admin">
ADMIN PANEL
</div>

</div>

</header>


<div class="container">


<!-- CITY -->

<div class="top-card">

<div class="section-title">
CITY / PARTY
</div>

<div class="buttons">

<button
class="btn city active"
id="city-rajkot"
onclick="setCity('rajkot')">
RAJKOT
</button>

<button
class="btn city"
id="city-ahmedabad"
onclick="setCity('ahmedabad')">
AHMEDABAD
</button>

<button
class="btn city"
id="city-udaan"
onclick="setCity('udaan')">
UDAAN
</button>

</div>

</div>


<!-- MONTH -->

<div class="top-card">

<div class="section-title">
RATE MONTH
</div>

<div class="buttons">

<button
class="btn month active"
id="month-current"
onclick="setMonth('CURRENT')">
CURRENT MONTH
</button>

<button
class="btn month"
id="month-next"
onclick="setMonth('NEXT')">
NEXT MONTH
</button>

</div>

</div>


<!-- PRODUCT -->

<div class="top-card">

<div class="section-title">
PRODUCT
</div>

<div class="buttons">

<button
class="btn product active"
data-product="palm"
onclick="setProduct('palm')">
PALM
</button>

<button
class="btn product"
data-product="visvita"
onclick="setProduct('visvita')">
VISVITA
</button>

<button
class="btn product"
data-product="soya"
onclick="setProduct('soya')">
SOYA
</button>

<button
class="btn product"
data-product="sunflower"
onclick="setProduct('sunflower')">
SUNFLOWER
</button>

<button
class="btn product"
data-product="groundnut"
onclick="setProduct('groundnut')">
GROUNDNUT
</button>

<button
class="btn product"
data-product="cotton"
onclick="setProduct('cotton')">
COTTONSEED
</button>

<button
class="btn product"
data-product="mustard"
onclick="setProduct('mustard')">
MUSTARD
</button>

</div>

</div>


<!-- CONTROL -->

<div class="control-bar">

<div>

<button
id="lockButton"
class="lock-btn locked"
onclick="toggleLock()">
🔒 LOCKED
</button>

</div>

<div>

<button
id="saveButton"
class="save-btn"
onclick="saveRates()"
disabled>
SAVE RATE UPDATE
</button>

</div>

</div>


<!-- MASTER -->

<div class="master-grid">


<!-- 15 KG MASTER -->

<div class="master-card">

<div class="master-title">
15 KG MASTER
</div>

<div class="master-grid-inner">

<div>

<label>
OLD RATE
</label>

<input
type="number"
step="0.01"
id="master15Old"
disabled>

</div>


<div>

<label>
CHANGE (+ / -)
</label>

<input
type="number"
step="0.01"
id="master15Change"
value="0"
disabled>

</div>


<div>

<label>
NEW RATE
</label>

<input
type="number"
step="0.01"
id="master15New"
class="new-master"
disabled>

</div>

</div>

</div>


<!-- 1 LTR MASTER -->

<div class="master-card">

<div class="master-title">
1 LTR MASTER
</div>

<div class="master-grid-inner">

<div>

<label>
OLD RATE
</label>

<input
type="number"
step="0.01"
id="master1Old"
disabled>

</div>


<div>

<label>
CHANGE (+ / -)
</label>

<input
type="number"
step="0.01"
id="master1Change"
value="0"
disabled>

</div>


<div>

<label>
NEW RATE
</label>

<input
type="number"
step="0.01"
id="master1New"
class="new-master"
disabled>

</div>

</div>

</div>

</div>


<!-- RATE TABLE -->

<div class="table-card">

<div class="table-title">

<span id="productTitle">
PALM
</span>

&nbsp; — PACKING RATE FORMULA

</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
PACKING
</th>

<th>
OLD RATE
</th>

<th>
MASTER LINK
</th>

<th>
RATE CHANGE
</th>

<th>
ROUND OFF
</th>

<th>
NEW RATE
</th>

</tr>

</thead>

<tbody id="rateRows"></tbody>

</table>

</div>

</div>


<!-- HISTORY -->

<div class="history-card">

<div class="history-title">
📋 LAST 3 DAYS RATE CHANGE HISTORY
</div>

<div id="historyList"></div>

</div>


</div>


<div
class="message"
id="message">
RATE UPDATED SUCCESSFULLY
</div>


<script>

/* =====================================================
   PRODUCT DATA
===================================================== */

const PRODUCTS={

palm:{
name:"PALM",
rates:[
["15 KG N TIN",2384],
["15 KG S TIN",2339],
["15 LTR N TIN",2174],
["15 LTR S TIN",2129],
["5 LTR JAR",731],
["4.150 KG JAR",701],
["2 LTR JAR",299.46],
["1.6 KG JAR",274.46],
["1 LTR BOTTLE",146.20],
["1 LTR POUCH",141.20],
["790 GM BOTTLE",136.20],
["750 GM POUCH",124.70],
["500 ML BOTTLE",74.60],
["500 ML POUCH",72.10],
["395 GM BOTTLE",69.60]
]
},

visvita:{
name:"VISVITA",
rates:[
["15 KG OLD TIN",0],
["15 KG NEW TIN",0]
]
},

soya:{
name:"SOYA",
rates:[
["15 KG",0],
["1 LTR",0]
]
},

sunflower:{
name:"SUNFLOWER",
rates:[
["15 KG",0],
["1 LTR",0]
]
},

groundnut:{
name:"GROUNDNUT",
rates:[
["15 KG",0],
["1 LTR",0]
]
},

cotton:{
name:"COTTONSEED",
rates:[
["15 KG",0],
["1 LTR",0]
]
},

mustard:{
name:"MUSTARD",
rates:[
["15 KG",0],
["1 LTR",0]
]
}

};


/* =====================================================
   STATE
===================================================== */

let city="rajkot";

let month="CURRENT";

let product="palm";

let isLocked=true;


/* =====================================================
   DATABASE
===================================================== */

let db=
JSON.parse(
localStorage.getItem(
"VISHWAS_RATE_DATABASE_V2"
)
)||{};


/* =====================================================
   GET PRODUCT
===================================================== */

function getProduct(){

if(!db[city])
db[city]={};

if(!db[city][month])
db[city][month]={};

if(!db[city][month][product]){

db[city][month][product]=
JSON.parse(
JSON.stringify(
PRODUCTS[product]
)
);

}

return db[city][month][product];

}


/* =====================================================
   MASTER DETECTION
===================================================== */

function getMaster(name){

let n=name.toLowerCase();

if(
n.includes("15 kg")||
n.includes("15kg")||
n.includes("15 ltr")
)
return "15KG";

return "1LTR";

}


/* =====================================================
   EXCEL RATE LINK
===================================================== */

function getDefaultChange(name){

let n=name.toLowerCase();

/*
15 KG LINK
*/

if(
n.includes("15 kg")||
n.includes("15kg")||
n.includes("15 ltr")
)
return 1;


/*
1 LTR LINK
*/

if(n.includes("5 ltr"))
return 5;

if(n.includes("4.150"))
return 5;

if(n.includes("2 ltr"))
return 2;

if(n.includes("1.6"))
return 2;

if(n.includes("1 ltr"))
return 1;

if(n.includes("790"))
return 1;

if(n.includes("750"))
return 1;

if(n.includes("500"))
return .5;

if(n.includes("395"))
return .5;

return 1;

}


/* =====================================================
   ROUND OFF
===================================================== */

function getDefaultRound(name){

let n=name.toLowerCase();

if(
n.includes("15 kg")||
n.includes("15kg")||
n.includes("15 ltr")
)
return 1;

if(
n.includes("5 ltr")||
n.includes("4.150")
)
return .5;

return .1;

}


/* =====================================================
   ROUND FUNCTION
===================================================== */

function roundRate(value,round){

if(!round || round<=0)
return Number(value.toFixed(2));

return Number(
(
Math.round(value/round)*round
).toFixed(2)
);

}


/* =====================================================
   SET CITY
===================================================== */

function setCity(value){

city=value;

document
.querySelectorAll(".city")
.forEach(x=>{
x.classList.remove("active");
});

document
.getElementById(
"city-"+city
)
.classList.add("active");

load();

}


/* =====================================================
   SET MONTH
===================================================== */

function setMonth(value){

month=value;

document
.querySelectorAll(".month")
.forEach(x=>{
x.classList.remove("active");
});

document
.getElementById(
"month-"+month.toLowerCase()
)
.classList.add("active");

load();

}


/* =====================================================
   SET PRODUCT
===================================================== */

function setProduct(value){

product=value;

document
.querySelectorAll(".product")
.forEach(x=>{
x.classList.remove("active");
});

document
.querySelector(
'[data-product="'+product+'"]'
)
.classList.add("active");

load();

}


/* =====================================================
   MASTER CALC
===================================================== */

function calculateMasters(){

let old15=
Number(
document.getElementById(
"master15Old"
).value
)||0;

let change15=
Number(
document.getElementById(
"master15Change"
).value
)||0;

document.getElementById(
"master15New"
).value=
(old15+change15).toFixed(2);


let old1=
Number(
document.getElementById(
"master1Old"
).value
)||0;

let change1=
Number(
document.getElementById(
"master1Change"
).value
)||0;

document.getElementById(
"master1New"
).value=
(old1+change1).toFixed(2);

}


/* =====================================================
   CALCULATE TABLE
===================================================== */

function calculateRows(){

calculateMasters();

let data=getProduct();

data.rates.forEach(
(row,index)=>{

let old=
Number(
document.getElementById(
"old-"+index
).value
)||0;

let master=
document.getElementById(
"master-"+index
).value;

let link=
Number(
document.getElementById(
"link-"+index
).value
)||0;

let round=
Number(
document.getElementById(
"round-"+index
).value
)||0;

let masterChange=0;

if(master==="15KG"){

masterChange=
Number(
document.getElementById(
"master15Change"
).value
)||0;

}

if(master==="1LTR"){

masterChange=
Number(
document.getElementById(
"master1Change"
).value
)||0;

}

let newRate=old;

if(master!=="MANUAL"){

newRate=
old+
(
masterChange*
link
);

newRate=
roundRate(
newRate,
round
);

}

document.getElementById(
"new-"+index
).value=
newRate.toFixed(2);

}
);

}


/* =====================================================
   RENDER TABLE
===================================================== */

function renderTable(){

let data=getProduct();

let tbody=
document.getElementById(
"rateRows"
);

tbody.innerHTML="";


data.rates.forEach(
(row,index)=>{

let name=row[0];

let old=row[1];

let saved=row[2]||{};

let master=
saved.master||
getMaster(name);

let link=
saved.link!==undefined
?saved.link
:getDefaultChange(name);

let round=
saved.round!==undefined
?saved.round
:getDefaultRound(name);


let tr=
document.createElement("tr");

tr.innerHTML=`

<td>
<b>${name}</b>
</td>

<td>

<input
type="number"
step="0.01"
id="old-${index}"
value="${old}"
${isLocked?"disabled":""}
>

</td>


<td>

<select
id="master-${index}"
${isLocked?"disabled":""}
>

<option
value="15KG"
${master==="15KG"?"selected":""}>
15 KG MASTER
</option>

<option
value="1LTR"
${master==="1LTR"?"selected":""}>
1 LTR MASTER
</option>

<option
value="MANUAL"
${master==="MANUAL"?"selected":""}>
MANUAL
</option>

</select>

</td>


<td>

<input
class="rate-link"
type="number"
step="0.01"
id="link-${index}"
value="${link}"
${isLocked?"disabled":""}
>

</td>


<td>

<input
class="round"
type="number"
step="0.01"
id="round-${index}"
value="${round}"
${isLocked?"disabled":""}
>

</td>


<td>

<input
class="rate-new"
type="number"
step="0.01"
id="new-${index}"
value="${old}"
${isLocked?"disabled":""}
>

</td>

`;


tbody.appendChild(tr);


/*
EVENTS
*/

[
"old-",
"master-",
"link-",
"round-"
].forEach(prefix=>{

document
.getElementById(
prefix+index
)
.addEventListener(
"input",
calculateRows
);

document
.getElementById(
prefix+index
)
.addEventListener(
"change",
calculateRows
);

});

}
);


document.getElementById(
"productTitle"
).innerText=
data.name+
" — "+
city.toUpperCase()+
" — "+
month;


calculateRows();

}


/* =====================================================
   LOAD MASTER
===================================================== */

function load(){

let data=getProduct();

let master15=
data.master15||
null;

let master1=
data.master1||
null;


document.getElementById(
"master15Old"
).value=
master15
?master15.old
:findFirst15(data);


document.getElementById(
"master15Change"
).value=
master15
?master15.change
:0;


document.getElementById(
"master1Old"
).value=
master1
?master1.old
:findFirst1(data);


document.getElementById(
"master1Change"
).value=
master1
?master1.change
:0;


renderTable();

renderHistory();

}


/* =====================================================
   FIND MASTER RATE
===================================================== */

function findFirst15(data){

let r=
data.rates.find(
x=>{
let n=x[0].toLowerCase();

return(
n.includes("15 kg")||
n.includes("15kg")
);
}
);

return r?r[1]:0;

}


function findFirst1(data){

let r=
data.rates.find(
x=>
x[0]
.toLowerCase()
.includes("1 ltr")
);

return r?r[1]:0;

}


/* =====================================================
   LOCK
===================================================== */

function toggleLock(){

isLocked=!isLocked;

let btn=
document.getElementById(
"lockButton"
);

let save=
document.getElementById(
"saveButton"
);


if(isLocked){

btn.innerText=
"🔒 LOCKED";

btn.className=
"lock-btn locked";

save.disabled=true;

}else{

btn.innerText=
"🔓 UNLOCKED";

btn.className=
"lock-btn unlocked";

save.disabled=false;

}

load();

}


/* =====================================================
   SAVE
===================================================== */

function saveRates(){

if(isLocked){

alert(
"Panel LOCKED hai. Pehle UNLOCK kare."
);

return;

}


let data=getProduct();

let history=[];


/*
SAVE MASTER CHANGES
*/

let oldMaster15=
Number(
document.getElementById(
"master15Old"
).value
)||0;

let change15=
Number(
document.getElementById(
"master15Change"
).value
)||0;

let newMaster15=
oldMaster15+change15;


let oldMaster1=
Number(
document.getElementById(
"master1Old"
).value
)||0;

let change1=
Number(
document.getElementById(
"master1Change"
).value
)||0;

let newMaster1=
oldMaster1+change1;


/*
SAVE PACKINGS
*/

data.rates.forEach(
(row,index)=>{

let oldRate=
Number(
document.getElementById(
"old-"+index
).value
)||0;

let newRate=
Number(
document.getElementById(
"new-"+index
).value
)||0;

let master=
document.getElementById(
"master-"+index
).value;

let link=
Number(
document.getElementById(
"link-"+index
).value
)||0;

let round=
Number(
document.getElementById(
"round-"+index
).value
)||0;


/*
HISTORY ONLY IF CHANGED
*/

if(
oldRate!==newRate
){

history.push({

date:new Date().toISOString(),

city:city,

month:month,

product:product,

packing:row[0],

oldRate:oldRate,

newRate:newRate

});

}


/*
NEW RATE BECOMES OLD RATE
AFTER SAVE
*/

data.rates[index]=[

row[0],

newRate,

{
master:master,
link:link,
round:round
}

];

});


/*
MASTER AFTER UPDATE
*/

data.master15={

old:newMaster15,

change:0,

newRate:newMaster15

};

data.master1={

old:newMaster1,

change:0,

newRate:newMaster1

};


/*
SAVE HISTORY
*/

let oldHistory=
JSON.parse(
localStorage.getItem(
"VISHWAS_RATE_HISTORY"
)
)||[];

oldHistory=
oldHistory.concat(history);


/*
KEEP ONLY LAST 3 DAYS
*/

let now=
Date.now();

oldHistory=
oldHistory.filter(
x=>{

let t=
new Date(x.date)
.getTime();

/* =====================================================
   HISTORY
===================================================== */

function renderHistory(){

let list=
document.getElementById(
"historyList"
);

let history=
JSON.parse(
localStorage.getItem(
"VISHWAS_RATE_HISTORY"
)
)||[];


let now=Date.now();

history=
history.filter(
x=>
now-
new Date(x.date).getTime()
<=
3*24*60*60*1000
);


history.sort(
(a,b)=>
new Date(b.date)-
new Date(a.date)
);


if(!history.length){

list.innerHTML=
`
<div class="empty-history">
Last 3 days me koi rate change nahi hua.
</div>
`;

return;

}


list.innerHTML="";


history.forEach(
x=>{

let d=
new Date(x.date);

let div=
document.createElement("div");

div.className=
"history-item";

div.innerHTML=`

<div>

<b>
${x.product.toUpperCase()}
</b>
&nbsp; —
${x.packing}

</div>

<div>

${x.city.toUpperCase()}
&nbsp; | &nbsp;
${x.month}

</div>

<div>

<span class="old-rate">
₹${Number(x.oldRate).toFixed(2)}
</span>

&nbsp; →
&nbsp;

<span class="new-history">
₹${Number(x.newRate).toFixed(2)}
</span>

</div>

<div class="history-date">

${d.toLocaleString()}

</div>

`;

list.appendChild(div);

});

}


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text){

let box=
document.getElementById(
"message"
);

box.innerText=text;

box.style.display="block";

setTimeout(
()=>{
box.style.display="none";
},
3000
);

}


/* =====================================================
   START
===================================================== */

load();

</script>
