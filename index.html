<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vishwas Rate - Customer</title><style>*{box-sizing:border-box}
body{margin:0;background:#fff;color:#172033;font-family:Arial,Helvetica,sans-serif}
header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10;box-shadow:0 4px 18px #00000012}
.head{max-width:1400px;margin:auto;padding:12px 20px}.brand{display:flex;align-items:center;gap:12px}
.logo{width:82px;height:82px;object-fit:contain;border-radius:10px;border:2px solid #b71c1c;background:#fff;box-shadow:0 5px 16px #b71c1c45;animation:logoFloat 3s ease-in-out infinite}
.company{font-size:20px;font-weight:900;letter-spacing:.2px}.sub{font-size:11px;color:#667085;margin-top:3px;font-weight:700}
.citybar{max-width:1400px;margin:auto;padding:8px 20px 12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.city{border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:7px 13px;font-weight:900;cursor:pointer;transition:.2s}.city:hover{transform:translateY(-1px)}
.city.active{background:linear-gradient(135deg,#b71c1c,#ef5350,#8e0000);color:#fff;border-color:#b71c1c;box-shadow:0 4px 12px #b71c1c35}
.date{margin-left:auto;color:#667085;font-size:11px;font-weight:700;align-self:center}.live{font-size:10px;font-weight:900;color:#087f70}
main{max-width:1400px;margin:16px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{position:relative;overflow:hidden;background:rgba(255,255,255,.97);border:1px solid #dfe5eb;border-radius:14px;padding:11px;box-shadow:0 7px 20px #0000000d;transition:transform .25s,box-shadow .25s,border-color .25s;animation:cardIn .55s cubic-bezier(.2,.7,.2,1) both}
.card:after{content:"";position:absolute;top:-80%;left:-40%;width:35%;height:260%;background:linear-gradient(90deg,transparent,#ffffff66,transparent);transform:rotate(18deg);pointer-events:none;animation:shine 5s ease-in-out infinite}
.card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,#8e0000,#ef5350,#ff8a80,#ef5350,#8e0000);background-size:250% 100%;animation:redSweep 4s linear infinite}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 28px #00000018;border-color:#b71c1c}
.top{display:flex;justify-content:space-between;align-items:center;gap:7px;padding-top:3px}.name{font-size:16px;font-weight:900;letter-spacing:.2px;color:#111827;display:flex;align-items:center;gap:7px}.small{font-size:10px;color:#667085;margin-top:2px}
.copy{flex:0 0 auto;border:0;min-width:27px;height:24px;border-radius:6px;background:linear-gradient(135deg,#b71c1c,#ef5350,#8e0000);color:#fff;font-size:12px;font-weight:900;cursor:pointer;padding:0 7px;line-height:24px;box-shadow:0 2px 6px #087f7030;transition:.18s}.copy:hover{background:#8e0000;transform:scale(1.08)}.copy:active{transform:scale(.94)}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:9px;overflow:hidden;border:1px solid #d5dde5;border-radius:8px}th,td{border:0;border-bottom:1px solid #d5dde5;padding:6px 7px;font-size:11px}th{background:linear-gradient(90deg,#fff5f5,#ffcdd2,#ef9a9a,#ffcdd2,#fff5f5);background-size:250% 100%;animation:redSweep 5s linear infinite;color:#8e0000;font-weight:900;text-align:center}td{background:#fff;font-weight:900}td:first-child{color:#263238}td:last-child{text-align:right;color:#8e0000}tr:last-child td{border-bottom:0}tr:hover td{background:#fff2b8}
.productTerms{margin-top:9px;padding:8px 9px;border-radius:8px;background:linear-gradient(135deg,#fff5f5,#fff);border:1px solid #ef9a9a;color:#394150;font-size:10px;line-height:1.45}.productTerms strong{display:block;color:#8e0000;font-size:10px;margin-bottom:3px}.productTermsLine{white-space:pre-line}
.empty,.loading{grid-column:1/-1;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:35px;text-align:center;color:#667085}.toast{display:none;position:fixed;right:18px;bottom:18px;background:linear-gradient(135deg,#b71c1c,#ef5350,#8e0000);color:#fff;padding:11px 15px;border-radius:9px;font-weight:900;z-index:50;box-shadow:0 8px 24px #0003}
@keyframes logoFloat{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(1deg)}}@keyframes shine{0%,70%{left:-40%}100%{left:130%}}@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes redSweep{0%{background-position:-250% 0}100%{background-position:250% 0}}
.themeBtn{border:1px solid #d0d5dd;background:#fff;color:#172033;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:900;cursor:pointer;transition:.2s}.themeBtn:hover{transform:translateY(-1px);box-shadow:0 3px 10px #0001}
.siteFooter{margin-top:24px;background:#101827;color:#e5e7eb;text-align:center;padding:18px 14px;font-size:11px;font-weight:800;letter-spacing:.2px;border-top:3px solid #b71c1c}.siteFooter strong{color:#fff}
body.dark{background:#0f1720;color:#e5e7eb}body.dark header{background:#111827;border-color:#263244;box-shadow:0 4px 18px #0005}body.dark .company{color:#fff}body.dark .sub,body.dark .date{color:#aab4c2}body.dark .city{background:#172033;color:#e5e7eb;border-color:#344054}body.dark .city.active{color:#fff}body.dark .card{background:#151e2b;border-color:#344054;box-shadow:0 7px 20px #0004}body.dark .name{color:#fff}body.dark .small{color:#aab4c2}body.dark table{border-color:#344054}body.dark th{background:linear-gradient(90deg,#3a1719,#5a2024,#7a282e,#5a2024,#3a1719);color:#ffd3d6}body.dark td{background:#111827;color:#e5e7eb;border-color:#344054}body.dark td:first-child{color:#e5e7eb}body.dark tr:hover td{background:#263244}body.dark .productTerms{background:linear-gradient(135deg,#24191b,#172033);border-color:#6f3035;color:#d4d9e2}body.dark .productTerms strong{color:#ff9ca2}body.dark .themeBtn{background:#172033;color:#fff;border-color:#475467}body.dark .oilVisual{background:linear-gradient(145deg,#202b3a,#111827);border-color:#475467;box-shadow:0 4px 14px #0005}body.dark .oilMini{color:#ffb1b6}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}.card:nth-child(5){animation-delay:.24s}.card:nth-child(6){animation-delay:.30s}.card:nth-child(7){animation-delay:.36s}.card:nth-child(8){animation-delay:.42s}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.company{font-size:17px}.date{width:100%;margin-left:0}.grid{grid-template-columns:1fr}.card{padding:10px}.name{font-size:15px}.oilVisual{width:50px;height:50px;border-radius:12px}.oilEmoji{font-size:23px}th,td{font-size:12px;padding:7px 6px}.copy{height:27px;line-height:27px;font-size:13px}}
body{transition:background-color .35s ease,color .35s ease}
header{animation:headerDrop .5s cubic-bezier(.2,.7,.2,1) both;transition:background-color .35s ease,border-color .35s ease,box-shadow .35s ease}
.citybar{animation:softReveal .55s .08s ease both}
.live{display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#e9f8f3;border:1px solid #bfe8da;transition:.25s}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#0f9f73;box-shadow:0 0 0 0 #0f9f7355;animation:livePulse 2s ease-out infinite}
.grid{perspective:1200px}
.card{transform-origin:center bottom;will-change:transform,opacity;transition:transform .24s ease,box-shadow .24s ease,border-color .24s ease,background-color .35s ease}
.card:nth-child(even){background:#f7f9fc;border-color:#d8dee7}
.card:nth-child(even):before{height:5px;background:linear-gradient(90deg,#651015,#b71c1c,#ef5350,#b71c1c,#651015)}
.card:hover{transform:translateY(-5px) scale(1.012);box-shadow:0 16px 34px #1018271c}
.card .top{transition:transform .22s ease}.card:hover .top{transform:translateY(-1px)}
.productVisual{display:flex;align-items:center;min-width:64px}.oilVisual{width:58px;height:58px;border-radius:14px;border:1px solid #e7b5b8;background:linear-gradient(145deg,#fff7f7,#fff);box-shadow:0 4px 12px #b71c1c18;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex:0 0 auto;transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s ease,border-color .32s ease;animation:iconFloat 3.2s ease-in-out infinite}.oilEmoji{font-size:27px;line-height:1;filter:saturate(1.05)}.oilMini{font-size:7px;font-weight:950;color:#8e0000;letter-spacing:.35px;line-height:1}.card:hover .oilVisual{transform:translateY(-2px) scale(1.06) rotate(-1deg);box-shadow:0 9px 22px #b71c1c28}.card:nth-child(even) .oilVisual{background:linear-gradient(145deg,#f4f7fb,#fff);border-color:#ced7e3}
.copy{position:relative;overflow:hidden;isolation:isolate}.copy:after{content:"";position:absolute;top:-100%;left:-45%;width:28%;height:300%;background:linear-gradient(90deg,transparent,#ffffff99,transparent);transform:rotate(18deg);transition:left .55s ease}.copy:hover:after{left:125%}.copy:hover{box-shadow:0 7px 16px #b71c1c35}
.themeBtn{transition:transform .22s ease,box-shadow .22s ease,background-color .35s ease,color .35s ease}.themeBtn:hover{transform:translateY(-2px) rotate(-1deg)}
tbody tr{transition:background-color .18s ease,transform .18s ease}
tbody tr:nth-child(odd) td{background:#fff}
tbody tr:nth-child(even) td{background:#f1f4f8}
tbody tr:hover td{background:#fff0b8!important}
tbody tr:hover td:first-child{box-shadow:inset 4px 0 0 #b71c1c}
td:last-child{transition:transform .2s ease,color .2s ease,background-color .2s ease}
tbody tr:hover td:last-child{transform:scale(1.035);color:#b71c1c}
.productTerms{transition:transform .22s ease,box-shadow .22s ease,background-color .35s ease,border-color .35s ease}.card:hover .productTerms{transform:translateY(-1px);box-shadow:0 5px 14px #b71c1c12}
.siteFooter{animation:footerRise .6s .18s ease both;transition:background-color .35s ease,color .35s ease}
body.dark .live{background:#0d2d29;border-color:#20584f;color:#9fe4cf}
body.dark .live:before{background:#45d8ab}
body.dark .card:nth-child(even){background:#111a27;border-color:#405064}
body.dark tbody tr:nth-child(odd) td{background:#111827}
body.dark tbody tr:nth-child(even) td{background:#182231}
body.dark tbody tr:hover td{background:#29384d!important}
body.dark tbody tr:hover td:first-child{box-shadow:inset 4px 0 0 #ef5350}
@keyframes headerDrop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@keyframes softReveal{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes livePulse{0%{box-shadow:0 0 0 0 #0f9f7355}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes footerRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body>
<header><div class="head"><div class="brand"><img class="logo" src="logo.png" alt="Logo"><div><div class="company">VISHWAS REFOILS &amp; CONSUMER LIMITED</div><div class="sub">DAILY RATE</div></div></div></div><div class="citybar"><button class="city active" data-city="Rajkot">RAJKOT</button><button class="city" data-city="Ahmedabad">AHMEDABAD</button><button class="city" data-city="Udaan">UDAAN</button><span id="live" class="live">LIVE RATE</span><button id="themeBtn" class="themeBtn" type="button">🌙 DARK</button><span id="date" class="date"></span></div></header>
<main><div id="products" class="grid"><div class="loading">Loading latest rates…</div></div></main><footer class="siteFooter">All Rights Reserved © 2025 <strong>VISHWAS REFOILS &amp; CONSUMER LIMITED</strong></footer><div id="toast" class="toast"></div><script>
const STORAGE_KEYS=["VRCL_ADMIN_DATA_V11","VRCL_ADMIN_DATA","vishwas-rate-data"];
const REMOTE_FILE="rates.json";
const DEFAULT_TERMS="Rates are subject to change. Please confirm the latest rate before placing the order.";
let selectedCity="Rajkot", sharedData=null, lastRemoteStamp="";
function esc(x){return String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(x){const n=Number(x);return Number.isFinite(n)?"₹"+n.toFixed(2):"₹0.00"}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>x.style.display="none",1700)}
function localFallback(){for(const k of STORAGE_KEYS){try{const x=localStorage.getItem(k);if(x)return JSON.parse(x)}catch(e){}}return null}
function data(){return sharedData||localFallback()}
function rows(p,cd){const d=cd[p.id]||p.cities?.[selectedCity]||p;return Array.isArray(d?.packings)?d.packings:Array.isArray(d?.rows)?d.rows:[]}
function note(p,cd){const x=cd[p.id]||p.cities?.[selectedCity]||p;return x?.narration||x?.terms||x?.termsAndConditions||p?.narration||p?.terms||""}
function currentDateText(){return new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"long",year:"numeric"})}
function buildCopyText(p,rs,n){n=String(n||DEFAULT_TERMS).trim();const lines=["JAY SIYARAM","*VISHWAS REFOILS & CONSUMER LIMITED*",currentDateText(),"",p.name];rs.forEach(r=>lines.push((r.packing||r.name||"")+"    "+Number(r.newRate??r.rate??r.price??0).toFixed(2)));if(n)lines.push("","TERMS & CONDITIONS",...n.split(/\r?\n/));return lines.join("\n")}
function copyRate(p,rs,n){const text=buildCopyText(p,rs,n);if(navigator.clipboard)navigator.clipboard.writeText(text).then(()=>toast("✓ RATE COPIED")).catch(()=>fallback(text));else fallback(text)}
function fallback(text){const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();toast("✓ RATE COPIED")}
function productVisualData(name){const n=String(name||"").toLowerCase();if(n.includes("palm"))return ["🌴","PALM OIL"];if(n.includes("sun"))return ["🌻","SUN OIL"];if(n.includes("ground"))return ["🥜","GN OIL"];if(n.includes("cotton"))return ["☁️","COTTON OIL"];if(n.includes("mustard"))return ["🌼","MUSTARD"];if(n.includes("soya")||n.includes("soy"))return ["🌱","SOYA OIL"];if(n.includes("visvita"))return ["🫗","COOKING OIL"];return ["🛢️","EDIBLE OIL"]}
function render(){
 const d=data(),root=document.getElementById("products");
 if(!d){root.innerHTML='<div class="empty">No published rates available yet.</div>';return}
 const cd=d.cities?.[selectedCity]||{};
 const list=(Array.isArray(d.products)?d.products:[]).filter(p=>String(p.name||"").trim()&&rows(p,cd).some(r=>String(r.packing||r.name||"").trim()));
 if(!list.length){root.innerHTML='<div class="empty">No rates available for '+esc(selectedCity)+'.</div>';return}
 root.innerHTML=list.map((p,i)=>{
   const rs=rows(p,cd).filter(r=>String(r.packing||r.name||"").trim());
   const terms=String(note(p,cd)||DEFAULT_TERMS).trim();
   const v=productVisualData(p.name);
   return `<article class="card"><div class="top"><div><div class="name"><span class="productVisual"><span class="oilVisual" role="img" aria-label="${esc(v[1])}"><span class="oilEmoji">${v[0]}</span><span class="oilMini">${esc(v[1])}</span></span></span><span>${esc(p.name)}</span></div><div class="small">Latest published rate</div></div><button class="copy" data-i="${i}" title="Copy rate">⧉ COPY</button></div><table><thead><tr><th>PACKING</th><th>RATE</th></tr></thead><tbody>${rs.map(r=>`<tr><td>${esc(r.packing||r.name)}</td><td>${money(r.newRate??r.rate??r.price)}</td></tr>`).join("")}</tbody></table><div class="productTerms"><strong>TERMS &amp; CONDITIONS</strong><div class="productTermsLine">${esc(terms)}</div></div></article>`;
 }).join("");
 root.querySelectorAll(".copy").forEach((b,i)=>b.onclick=()=>{const p=list[i],rs=rows(p,cd).filter(r=>String(r.packing||r.name||"").trim());copyRate(p,rs,note(p,cd))});
}
async function loadRemote(silent=false){
 try{const res=await fetch(REMOTE_FILE+"?v="+Date.now(),{cache:"no-store"});if(!res.ok)throw new Error("HTTP "+res.status);const json=await res.json();if(!json||!Array.isArray(json.products)||!json.cities)throw new Error("Invalid data");sharedData=json;const stamp=String(json.updatedAt||"");if(document.getElementById("live"))document.getElementById("live").textContent=stamp?"LIVE • "+new Date(stamp).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"LIVE RATE";if(stamp!==lastRemoteStamp){lastRemoteStamp=stamp;render();if(silent)toast("✓ LATEST RATE LOADED")}}
 catch(e){if(document.getElementById("live"))document.getElementById("live").textContent="OFFLINE FALLBACK";if(!silent){sharedData=null;render()}}
}
function applyTheme(mode){const dark=mode==="dark";document.body.classList.toggle("dark",dark);const b=document.getElementById("themeBtn");if(b)b.textContent=dark?"☀️ LIGHT":"🌙 DARK";localStorage.setItem("VRCL_THEME",dark?"dark":"light")}
const savedTheme=localStorage.getItem("VRCL_THEME")||"light";applyTheme(savedTheme);document.getElementById("themeBtn").onclick=()=>applyTheme(document.body.classList.contains("dark")?"light":"dark");
document.querySelectorAll(".city").forEach(b=>b.onclick=()=>{selectedCity=b.dataset.city;document.querySelectorAll(".city").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
document.getElementById("date").textContent=currentDateText();loadRemote(false);setInterval(()=>loadRemote(true),60000);
</script></body></html>
