<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vishwas Refoils & Consumer Limited - Customer Rates</title><style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#172033;font-family:Arial,Helvetica,sans-serif}.hidden{display:none!important}
header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:10;box-shadow:0 4px 18px #00000012}.head{max-width:1400px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:12px}.logo{width:82px;height:82px;object-fit:contain;border-radius:10px;border:2px solid #b71c1c;background:#fff;box-shadow:0 5px 16px #b71c1c45;animation:logoFloat 3s ease-in-out infinite}.company{font-size:20px;font-weight:900}.sub{font-size:11px;color:#667085;margin-top:3px;font-weight:700}.spacer{flex:1}.logout{border:0;border-radius:8px;padding:8px 12px;background:#b71c1c;color:#fff;font-weight:900;cursor:pointer}
.citybar{max-width:1400px;margin:auto;padding:8px 20px 12px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}.city{border:1px solid #d0d5dd;background:linear-gradient(135deg,#b71c1c,#ef5350,#8e0000);color:#fff;border-radius:8px;padding:7px 13px;font-weight:900;box-shadow:0 4px 12px #b71c1c35}.date{margin-left:auto;color:#667085;font-size:11px;font-weight:700}.live{font-size:10px;font-weight:900;color:#087f70;display:inline-flex;align-items:center;gap:5px;padding:5px 8px;border-radius:999px;background:#e9f8f3;border:1px solid #bfe8da}.live:before{content:"";width:7px;height:7px;border-radius:50%;background:#0f9f73;animation:livePulse 2s ease-out infinite}.themeBtn{border:1px solid #d0d5dd;background:#fff;color:#172033;border-radius:8px;padding:6px 10px;font-size:11px;font-weight:900;cursor:pointer}
main{max-width:1400px;margin:16px auto;padding:0 14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;perspective:1200px}.card{position:relative;overflow:hidden;background:#fff;border:1px solid #dfe5eb;border-radius:14px;padding:11px;box-shadow:0 7px 20px #0000000d;transition:.25s;animation:cardIn .55s cubic-bezier(.2,.7,.2,1) both}.card:before{content:"";position:absolute;left:0;top:0;right:0;height:4px;background:linear-gradient(90deg,#8e0000,#ef5350,#ff8a80,#ef5350,#8e0000);background-size:250% 100%;animation:redSweep 4s linear infinite}.card:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 12px 28px #00000018;border-color:#b71c1c}.top{display:flex;justify-content:space-between;align-items:center;gap:7px;padding-top:3px}.name{font-size:16px;font-weight:900;color:#111827;display:flex;align-items:center;gap:7px}.small{font-size:10px;color:#667085;margin-top:2px}.oilVisual{width:58px;height:58px;border-radius:14px;border:1px solid #e7b5b8;background:linear-gradient(145deg,#fff7f7,#fff);box-shadow:0 4px 12px #b71c1c18;display:flex;flex-direction:column;align-items:center;justify-content:center}.oilEmoji{font-size:27px}.oilMini{font-size:7px;font-weight:950;color:#8e0000}.copy{border:0;height:28px;border-radius:6px;background:linear-gradient(135deg,#b71c1c,#ef5350,#8e0000);color:#fff;font-size:11px;font-weight:900;cursor:pointer;padding:0 8px}
table{width:100%;border-collapse:separate;border-spacing:0;margin-top:9px;border:1px solid #d5dde5;border-radius:8px;overflow:hidden}th,td{border:0;border-bottom:1px solid #d5dde5;padding:6px 7px;font-size:11px}th{background:linear-gradient(90deg,#fff5f5,#ffcdd2,#ef9a9a,#ffcdd2,#fff5f5);color:#8e0000;font-weight:900;text-align:center}td{background:#fff;font-weight:900}td:last-child{text-align:right;color:#8e0000}tr:last-child td{border-bottom:0}tr:hover td{background:#fff2b8}.productTerms{margin-top:9px;padding:8px 9px;border-radius:8px;background:linear-gradient(135deg,#fff5f5,#fff);border:1px solid #ef9a9a;color:#394150;font-size:10px;line-height:1.45}.productTerms strong{display:block;color:#8e0000;font-size:10px;margin-bottom:3px}.empty,.loading{grid-column:1/-1;background:#fff;border:1px dashed #cbd5e1;border-radius:12px;padding:35px;text-align:center;color:#667085}.toast{display:none;position:fixed;right:18px;bottom:18px;background:#101827;color:#fff;padding:11px 15px;border-radius:9px;font-weight:900;z-index:50}.siteFooter{margin-top:24px;background:#101827;color:#e5e7eb;text-align:center;padding:18px 14px;font-size:11px;font-weight:800;border-top:3px solid #b71c1c}.siteFooter strong{color:#fff}
.loginOverlay{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 20% 20%,#b71c1c22,transparent 28%),linear-gradient(135deg,#07111f,#101827);display:grid;place-items:center;padding:20px}.loginBox{width:min(430px,100%);background:#ffffff10;border:1px solid #ffffff26;border-radius:22px;padding:25px;color:#fff;backdrop-filter:blur(18px);box-shadow:0 30px 80px #0007}.loginLogo{width:78px;height:78px;display:block;margin:0 auto 12px;object-fit:contain;background:#fff;border-radius:15px;padding:5px}.loginTitle{text-align:center;font-size:18px;font-weight:950;line-height:1.3}.loginSub{text-align:center;font-size:11px;color:#cbd5e1;margin:7px 0 18px}.field{margin-top:12px}.field label{display:block;font-size:11px;font-weight:900;margin-bottom:5px}.field input{width:100%;padding:12px;border-radius:9px;border:1px solid #ffffff33;background:#091321;color:#fff;font:inherit}.loginBtn{width:100%;margin-top:15px;border:0;border-radius:9px;padding:12px;background:linear-gradient(135deg,#b71c1c,#ef5350);color:#fff;font-weight:950;cursor:pointer}.error{color:#ffb0b0;font-size:11px;font-weight:800;text-align:center;margin-top:10px;min-height:14px}.watermark{position:fixed;right:12px;bottom:12px;z-index:30;color:#10182726;font-size:10px;font-weight:950;pointer-events:none;transform:rotate(-8deg);max-width:60vw;text-align:right}
body.dark{background:#0f1720;color:#e5e7eb}body.dark header{background:#111827;border-color:#263244}body.dark .company{color:#fff}body.dark .sub,body.dark .date{color:#aab4c2}body.dark .themeBtn{background:#172033;color:#fff;border-color:#475467}body.dark .card{background:#151e2b;border-color:#344054}body.dark .name{color:#fff}body.dark .small{color:#aab4c2}body.dark table{border-color:#344054}body.dark th{background:#5a2024;color:#ffd3d6}body.dark td{background:#111827;color:#e5e7eb;border-color:#344054}body.dark tr:hover td{background:#263244}body.dark .productTerms{background:#24191b;border-color:#6f3035;color:#d4d9e2}body.dark .watermark{color:#ffffff1d}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}@keyframes redSweep{0%{background-position:-250% 0}100%{background-position:250% 0}}@keyframes livePulse{0%{box-shadow:0 0 0 0 #0f9f7355}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media(max-width:1100px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.company{font-size:15px}.logo{width:62px;height:62px}.date{width:100%;margin-left:0}.grid{grid-template-columns:1fr}.card{padding:10px}}
</style></head><body>
<div id="loginOverlay" class="loginOverlay"><div class="loginBox"><img src="logo.png" class="loginLogo" alt="Logo"><div class="loginTitle">VISHWAS REFOILS &amp; CONSUMER LIMITED</div><div class="loginSub">PRIVATE WHOLESALE RATE PORTAL</div><form id="loginForm"><div class="field"><label>USER ID</label><input id="loginId" autocomplete="username" required></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required></div><button class="loginBtn">LOGIN</button><div id="loginError" class="error"></div></form></div></div>
<header><div class="head"><img class="logo" src="logo.png" alt="Logo"><div><div class="company">VISHWAS REFOILS &amp; CONSUMER LIMITED</div><div class="sub">DAILY WHOLESALE RATE</div></div><div class="spacer"></div><button id="logoutBtn" class="logout hidden">LOGOUT</button></div><div id="citybar" class="citybar hidden"><span id="cityPill" class="city"></span><span id="live" class="live">LIVE RATE</span><button id="themeBtn" class="themeBtn" type="button">🌙 DARK</button><span id="date" class="date"></span></div></header>
<main><div id="products" class="grid"><div class="loading">Login to view authorized rates.</div></div></main><footer class="siteFooter">All Rights Reserved © 2026 <strong>VISHWAS REFOILS &amp; CONSUMER LIMITED</strong></footer><div id="toast" class="toast"></div><div id="watermark" class="watermark hidden"></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';import {SUPABASE_URL,SUPABASE_ANON_KEY} from './supabase-config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);let profile=null,watch=null;const DEFAULT_TERMS='Rates are subject to change. Please confirm the latest rate before placing the order.';
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function money(x){const n=Number(x);return Number.isFinite(n)?'₹'+n.toFixed(2):'₹0.00'}function currentDateText(){return new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'long',year:'numeric'})}function toast(t){$('toast').textContent=t;$('toast').style.display='block';clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').style.display='none',1600)}
function productVisualData(name){const n=String(name||'').toLowerCase();if(n.includes('palm'))return['🌴','PALM OIL'];if(n.includes('sun'))return['🌻','SUN OIL'];if(n.includes('ground'))return['🥜','GN OIL'];if(n.includes('cotton'))return['☁️','COTTON OIL'];if(n.includes('mustard'))return['🌼','MUSTARD'];if(n.includes('soya'))return['🌱','SOYA OIL'];if(n.includes('visvita'))return['🫗','COOKING OIL'];return['🛢️','EDIBLE OIL']}
function copyRate(name,rows,terms){const lines=['JAY SIYARAM','*VISHWAS REFOILS & CONSUMER LIMITED*',currentDateText(),'','*'+name+'*'];rows.forEach(r=>lines.push(r.packing+'    '+Number(r.rate).toFixed(2)));if(terms)lines.push('','TERMS & CONDITIONS',terms);const text=lines.join('\n');navigator.clipboard?.writeText(text).then(()=>toast('✓ RATE COPIED'))}
async function localSignOut(){try{await supabase.auth.signOut({scope:'local'})}catch(_){}showLogin()}
function showLogin(msg=''){$('loginOverlay').classList.remove('hidden');$('citybar').classList.add('hidden');$('logoutBtn').classList.add('hidden');$('watermark').classList.add('hidden');$('products').innerHTML='<div class="loading">Login to view authorized rates.</div>';$('loginError').textContent=msg;if(watch){clearInterval(watch);watch=null}}
async function loadPortal(){const {data:{session}}=await supabase.auth.getSession();if(!session){showLogin();return}const {data,error}=await supabase.from('profiles').select('display_name,login_id,role,city,active').eq('id',session.user.id).single();if(error||!data||!data.active||data.role!=='wholesaler'||!data.city){await localSignOut();showLogin('Access not active. Contact company.');return}profile=data;$('loginOverlay').classList.add('hidden');$('citybar').classList.remove('hidden');$('logoutBtn').classList.remove('hidden');$('cityPill').textContent=data.city.toUpperCase();$('date').textContent=currentDateText();$('watermark').textContent=(data.display_name||data.login_id)+' • '+data.city+' • VISHWAS REFOILS & CONSUMER LIMITED • CONFIDENTIAL';$('watermark').classList.remove('hidden');await renderRates();startWatch()}
async function renderRates(){$('products').innerHTML='<div class="loading">Loading latest rates…</div>';const {data,error}=await supabase.from('rates').select('packing,rate,narration,sort_order,updated_at,products(name,sort_order)').eq('city',profile.city).order('sort_order');if(error){$('products').innerHTML='<div class="empty">Unable to load rates.</div>';return}const groups={};(data||[]).forEach(r=>{const n=r.products?.name||'Product';(groups[n]??=[]).push(r)});const names=Object.keys(groups);if(!names.length){$('products').innerHTML='<div class="empty">No rates published.</div>';return}$('products').innerHTML=names.map((name,i)=>{const rows=groups[name],terms=rows.find(x=>x.narration)?.narration||DEFAULT_TERMS,v=productVisualData(name);return `<article class="card" style="animation-delay:${i*.05}s"><div class="top"><div><div class="name"><span class="oilVisual"><span class="oilEmoji">${v[0]}</span><span class="oilMini">${esc(v[1])}</span></span><span>${esc(name)}</span></div><div class="small">Latest published rate</div></div><button class="copy" data-copy="${i}">⧉ COPY</button></div><table><thead><tr><th>PACKING</th><th>RATE</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.packing)}</td><td>${money(r.rate)}</td></tr>`).join('')}</tbody></table><div class="productTerms"><strong>TERMS & CONDITIONS</strong>${esc(terms)}</div></article>`}).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const name=names[Number(b.dataset.copy)],rows=groups[name],terms=rows.find(x=>x.narration)?.narration||DEFAULT_TERMS;copyRate(name,rows,terms)});const newest=(data||[]).map(x=>new Date(x.updated_at||0)).sort((a,b)=>b-a)[0];$('live').textContent=newest&&!isNaN(newest)?'LIVE • '+newest.toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'LIVE RATE'}
function startWatch(){if(watch)clearInterval(watch);watch=setInterval(async()=>{const {data:{session}}=await supabase.auth.getSession();if(!session){showLogin('Session ended.');return}const {data,error}=await supabase.from('profiles').select('id').eq('id',session.user.id).maybeSingle();if(error||!data){await localSignOut();showLogin('Logged in on another device. Old device logged out.')}},10000)}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginError').textContent='';const id=$('loginId').value.trim().toLowerCase();const email=id.includes('@')?id:`${id}@users.vrcl.in`;const {error}=await supabase.auth.signInWithPassword({email,password:$('password').value});if(error){$('loginError').textContent='Invalid User ID or password.';return}await loadPortal()});$('logoutBtn').onclick=localSignOut;
function applyTheme(mode){const dark=mode==='dark';document.body.classList.toggle('dark',dark);$('themeBtn').textContent=dark?'☀️ LIGHT':'🌙 DARK';localStorage.setItem('VISHWAS_THEME',dark?'dark':'light')}$('themeBtn').onclick=()=>applyTheme(document.body.classList.contains('dark')?'light':'dark');applyTheme(localStorage.getItem('VISHWAS_THEME')||'light');document.addEventListener('visibilitychange',()=>{if(!document.hidden&&profile)renderRates()});loadPortal();
</script></body></html>
