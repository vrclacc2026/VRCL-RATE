<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRCL Admin Rate Check</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f2ed;color:#172033}.hidden{display:none!important}.top{background:#101827;color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center}.brand{font-weight:950}.spacer{flex:1}.btn{border:0;border-radius:8px;padding:8px 10px;font-size:10px;font-weight:950;cursor:pointer;text-decoration:none}.light{background:#fff;color:#101827}.green{background:#087f70;color:#fff}.wrap{max-width:1400px;margin:15px auto;padding:0 12px}.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.city{padding:8px 11px;border:1px solid #cbd5e1;border-radius:8px;background:#fff;font-weight:900}.city.active{background:#101827;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.card{--pc:#b71c1c;background:#fff;border:1px solid #ded7cf;border-radius:14px;padding:10px;box-shadow:0 8px 20px #0000000d}.head{display:flex;align-items:center;gap:8px}.pic{width:54px;height:54px;border-radius:11px;border:1px solid #ddd;overflow:hidden;display:grid;place-items:center;font-size:7px;text-align:center}.pic img{width:100%;height:100%;object-fit:cover}.name{font-size:13px;font-weight:950;color:var(--pc);flex:1}.copy{border:1px solid var(--pc);background:#fff;color:var(--pc);border-radius:8px;padding:6px;font-size:8px;font-weight:950;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:7px}td,th{font-size:9px;padding:6px;border-bottom:1px solid #eee}th{background:#f7f7f7}.login{position:fixed;inset:0;z-index:99;background:#101827e8;display:grid;place-items:center}.box{width:min(390px,90%);background:#fff;border-radius:14px;padding:18px}.field{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:8px;margin-top:8px}.pass{position:relative}.eye{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:transparent}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}.card{position:relative;overflow:hidden;opacity:0;animation:checkCardEnter .48s cubic-bezier(.2,.72,.2,1) var(--delay,0ms) forwards;transition:transform .18s ease,box-shadow .18s ease}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--pc)}.card:after{content:"";position:absolute;width:100px;height:100px;right:-55px;top:-60px;border-radius:50%;background:var(--pc);opacity:.07;transition:transform .3s ease}.card:hover{transform:translateY(-4px);box-shadow:0 15px 31px #17203320}.card:hover:after{transform:scale(1.6)}.pic{transition:transform .2s ease,box-shadow .2s ease}.card:hover .pic{transform:translateY(-2px) rotate(-1deg);box-shadow:0 8px 16px #0002}.copy{transition:transform .14s ease,background .14s ease,color .14s ease}.copy:hover{transform:translateY(-1px);background:var(--pc);color:#fff}.city{cursor:pointer;transition:transform .14s ease,box-shadow .14s ease}.city:hover{transform:translateY(-1px)}.city.active{box-shadow:0 5px 12px #1018272b}.top{box-shadow:0 7px 24px #10182724}.wrap{position:relative}.wrap:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 9% 22%,#ffcf9c42,transparent 25%),radial-gradient(circle at 90% 72%,#8dd9cf35,transparent 28%);animation:checkAmbient 10s ease-in-out infinite alternate}@keyframes checkCardEnter{from{opacity:0;translate:0 14px;scale:.98}to{opacity:1;translate:0;scale:1}}@keyframes checkAmbient{to{transform:translate3d(0,-10px,0) scale(1.025)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important}.card{opacity:1!important}.card,.pic,.copy,.city{transition:none!important}}</style></head><body><div id="login" class="login"><div class="box"><b>🔒 ADMIN RATE CHECK</b><input id="email" class="field" type="email" placeholder="Admin email"><div class="pass"><input id="password" class="field" type="password" placeholder="Password"><button id="eye" class="eye">👁</button></div><button id="loginBtn" class="btn green" style="width:100%;margin-top:9px">LOGIN</button><div id="msg"></div></div></div><header class="top"><div class="brand">VISHWAS ADMIN RATE CHECK</div><div class="spacer"></div><a class="btn light" href="./admin.html">RATE ADMIN</a><a class="btn light" href="./dashboard.html">DASHBOARD</a></header><main class="wrap"><div id="cities" class="bar"></div><div id="grid" class="grid"></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
import{SUPABASE_URL,SUPABASE_ANON_KEY}from'./supabase-config.js';
const supabase=createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'vrcl-admin-auth'}});
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let city='Rajkot',products=[];const colors={palm:'#6d43c1',visvita:'#b71c1c',sunflower:'#dc8a00',groundnut:'#ef6c00',cotton:'#1167c7',mustard:'#0b6b43',soya:'#d32f2f'},companyName='VISHWAS REFOILS & CONSUMER LIMITED';$('eye').onclick=()=>{$('password').type=$('password').type==='password'?'text':'password'};function renderCities(){$('cities').innerHTML=['Rajkot','Ahmedabad','Udaan'].map(c=>`<button class="city ${c===city?'active':''}" data-c="${c}">${c}</button>`).join('');document.querySelectorAll('[data-c]').forEach(b=>b.onclick=async()=>{city=b.dataset.c;renderCities();await load()})}async function check(){const{data:{session}}=await supabase.auth.getSession();if(!session)return false;const{data:p}=await supabase.from('profiles').select('role,active').eq('id',session.user.id).single();if(!p||p.role!=='admin'||!p.active)return false;$('login').classList.add('hidden');renderCities();await load();return true}async function load(){const{data:ps}=await supabase.from('products').select('id,code,name,ingredient_image_url,city').eq('city',city).eq('active',true).order('sort_order');products=ps||[];const{data:rs}=await supabase.from('rates').select('product_id,packing,rate,narration').eq('city',city).order('sort_order');const by={};(rs||[]).forEach(r=>(by[r.product_id]||(by[r.product_id]=[])).push(r));$('grid').innerHTML=products.map((p,index)=>{const rows=by[p.id]||[],pic=p.ingredient_image_url?`<img src="${esc(p.ingredient_image_url)}">`:'PHOTO<br>NOT UPLOADED';return `<article class="card" style="--pc:${colors[p.code]||'#b71c1c'};--delay:${Math.min(index,12)*55}ms"><div class="head"><div class="pic">${pic}</div><div class="name">${esc(p.name)}</div><button class="copy" data-copy="${p.id}">COPY</button></div><table><thead><tr><th>PACKING</th><th>RATE</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.packing)}</td><td>₹ ${Number(r.rate||0).toFixed(2)}</td></tr>`).join('')}</tbody></table></article>`}).join('');document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.copy),rows=by[p.id]||[],narration=rows[0]?.narration?.trim()||'Rates are subject to change. Confirm latest rate before order.',date=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'});navigator.clipboard?.writeText(['JAY SIYARAM',`*${companyName}*`,date,'',`*${p.name}*`,...rows.map(r=>`${r.packing}  ${r.rate}`),'','TERMS & CONDITIONS',narration].join('\n'))})}$('loginBtn').onclick=async()=>{const{error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('msg').textContent='Invalid login';return}await check()};await check();
</script></body></html>
